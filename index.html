<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0d18">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FLUENCY</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d18;--surf:#16162a;--surf2:#1e1e35;--bdr:rgba(255,255,255,0.07);
  --txt:#f0f0f8;--mut:#6060a0;--acc:#7c6fff;--acc2:#ff6b9d;--acc3:#00e5b0;
  --gold:#ffd166;--lk:#2a2a42;--r:16px;--r2:24px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Sora','Noto Sans KR',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;}
.view{display:none;min-height:100vh;}
.view.active{display:block;}
.fs{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:300;overflow-y:auto;display:none;}
.fs.active{display:block;}

/* TOP BAR */
.topbar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:44px 20px 14px;background:rgba(13,13,24,0.93);backdrop-filter:blur(20px);z-index:200;border-bottom:1px solid var(--bdr);}
.tb-row{display:flex;align-items:center;justify-content:space-between;}
.logo{font-size:1.3rem;font-weight:900;letter-spacing:-0.05em;}
.logo span{background:linear-gradient(135deg,#7c6fff,#ff6b9d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.streak-badge{display:flex;align-items:center;gap:5px;background:rgba(255,209,102,0.1);border:1px solid rgba(255,209,102,0.22);border-radius:20px;padding:5px 12px;font-size:0.72rem;font-weight:700;color:var(--gold);}
.xp-wrap{margin-top:10px;}
.xp-meta{font-size:0.6rem;color:var(--mut);margin-bottom:4px;display:flex;justify-content:space-between;}
.xp-bar{height:5px;background:var(--surf2);border-radius:3px;overflow:hidden;}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:3px;transition:width 0.6s;}

/* PATH */
#path-view{padding:110px 0 100px;}
.path-wrap{padding:0 30px;}
.connector{width:3px;height:44px;margin:0 auto;border-radius:2px;background:linear-gradient(180deg,rgba(124,111,255,0.5),transparent);}
.connector.lk{background:linear-gradient(180deg,rgba(50,50,70,0.5),transparent);}
.node-wrap{display:flex;justify-content:center;position:relative;}
.node-wrap:nth-child(4n+1) .node{margin-left:0;}
.node-wrap:nth-child(4n+3) .node{margin-left:-80px;}
.node-wrap:nth-child(4n+5) .node{margin-left:0;}
.node-wrap:nth-child(4n+7) .node{margin-left:80px;}
.node{position:relative;width:78px;height:78px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform 0.2s;flex-shrink:0;}
.node:active{transform:scale(0.9)!important;}
.node.done{background:linear-gradient(145deg,#00e5b0,#00b880);box-shadow:0 5px 20px rgba(0,229,176,0.3),0 0 0 4px rgba(0,229,176,0.12);}
.node.cur{background:linear-gradient(145deg,#7c6fff,#ff6b9d);box-shadow:0 6px 26px rgba(124,111,255,0.5),0 0 0 5px rgba(124,111,255,0.18);animation:glow 2s infinite;}
.node.lk{background:var(--lk);box-shadow:none;cursor:default;}
.node.lk:active{transform:none!important;}
@keyframes glow{0%,100%{box-shadow:0 6px 26px rgba(124,111,255,0.5),0 0 0 5px rgba(124,111,255,0.18);}50%{box-shadow:0 6px 26px rgba(124,111,255,0.7),0 0 0 9px rgba(124,111,255,0.1);}}
.node-icon{font-size:1.55rem;line-height:1;}
.node-num{font-size:0.58rem;font-weight:800;opacity:0.75;margin-top:2px;}
.bubble{position:absolute;background:white;color:#1a1a2e;border-radius:12px;padding:6px 13px;font-size:0.76rem;font-weight:800;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,0.25);pointer-events:none;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);}
.bubble::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:white;border-bottom:0;}
.milestone{display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,rgba(255,209,102,0.1),rgba(255,107,157,0.06));border:1px solid rgba(255,209,102,0.18);border-radius:var(--r2);padding:13px 18px;margin:14px 10px;font-size:0.78rem;font-weight:700;color:var(--gold);}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(13,13,24,0.95);backdrop-filter:blur(20px);border-top:1px solid var(--bdr);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 16px 22px;gap:4px;z-index:200;}
.nb{background:none;border:none;font-family:inherit;font-size:0.63rem;font-weight:700;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;border-radius:12px;transition:all 0.2s;}
.nb-icon{font-size:1.2rem;}
.nb.active{color:var(--acc);}

/* DETAIL */
.dtopbar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:44px 20px 14px;background:rgba(13,13,24,0.95);backdrop-filter:blur(20px);z-index:301;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:12px;}
.back{width:40px;height:40px;border-radius:12px;background:var(--surf);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.1rem;flex-shrink:0;}
.dbody{padding:110px 20px 100px;}
.simg{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:var(--r2);margin-bottom:16px;background:var(--surf2);}
.simg-ph{width:100%;aspect-ratio:16/9;border-radius:var(--r2);margin-bottom:16px;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:2.5rem;border:1px solid var(--bdr);}
.shero{background:linear-gradient(135deg,rgba(124,111,255,0.13),rgba(255,107,157,0.07));border:1px solid rgba(124,111,255,0.2);border-radius:var(--r2);padding:20px;text-align:center;margin-bottom:14px;}
.shero-txt{font-size:1.18rem;font-weight:800;line-height:1.4;margin-bottom:8px;}
.phonetic{font-size:0.76rem;color:var(--acc);margin-bottom:6px;}
.meaning{font-size:0.72rem;color:var(--mut);line-height:1.6;}
.tts-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.ttsb{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:12px;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-family:inherit;font-size:0.77rem;font-weight:600;color:var(--txt);transition:all 0.2s;}
.ttsb.en{border-color:rgba(124,111,255,0.4);color:var(--acc);}
.ttsb.kr{border-color:rgba(0,229,176,0.38);color:var(--acc3);}
.sec{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r2);padding:16px;margin-bottom:12px;}
.sec-lbl{font-size:0.6rem;font-weight:700;letter-spacing:0.1em;color:var(--mut);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.sec-lbl::before{content:'';width:3px;height:11px;border-radius:2px;background:linear-gradient(var(--acc),var(--acc2));}
.scene-txt{font-size:0.83rem;line-height:1.8;}
.gr-txt{font-size:0.81rem;line-height:1.7;margin-bottom:8px;}
.taboo{background:rgba(255,209,102,0.06);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:9px 13px;font-size:0.75rem;color:var(--gold);line-height:1.6;}
.vi{font-size:0.79rem;padding:8px 12px;background:var(--surf2);border-radius:10px;margin-bottom:5px;border-left:3px solid rgba(124,111,255,0.38);}
.ri{font-size:0.76rem;padding:7px 12px;background:var(--surf2);border-radius:10px;margin-bottom:5px;color:var(--mut);border-left:3px solid rgba(0,229,176,0.28);}
.pt-txt{font-size:0.87rem;font-weight:700;color:var(--acc2);font-style:italic;margin-bottom:8px;}
.nr-txt{font-size:0.81rem;line-height:1.9;margin-bottom:12px;}
.closing{background:linear-gradient(135deg,rgba(124,111,255,0.09),rgba(255,107,157,0.06));border-radius:12px;padding:12px 14px;text-align:center;}
.closing-en{font-size:0.83rem;font-weight:600;color:var(--acc);margin-bottom:4px;font-style:italic;}
.closing-kr{font-size:0.72rem;color:var(--mut);}
.tts-full{width:100%;background:var(--surf2);border:1px solid rgba(0,229,176,0.3);border-radius:var(--r);padding:12px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-family:inherit;font-size:0.79rem;font-weight:600;color:var(--acc3);}
.sbtn{width:100%;background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;border-radius:var(--r2);padding:17px;font-family:inherit;font-size:0.95rem;font-weight:800;color:white;cursor:pointer;margin-bottom:10px;box-shadow:0 8px 24px rgba(124,111,255,0.32);transition:all 0.2s;}
.sbtn:active{transform:scale(0.98);}
.sbtn.sec-btn{background:var(--surf2);box-shadow:none;border:1px solid var(--bdr);color:var(--txt);}

/* STEP */
.stopbar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:44px 20px 12px;background:rgba(13,13,24,0.95);backdrop-filter:blur(20px);z-index:401;border-bottom:1px solid var(--bdr);}
.st-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.st-lbl{font-size:0.8rem;font-weight:700;}
.exit-btn{background:rgba(255,80,80,0.09);border:1px solid rgba(255,80,80,0.22);border-radius:10px;padding:6px 13px;font-family:inherit;font-size:0.7rem;font-weight:700;color:rgba(255,110,110,0.88);cursor:pointer;}
.sdots{display:flex;gap:5px;}
.sdot{flex:1;height:3px;border-radius:2px;background:var(--surf2);transition:all 0.3s;}
.sdot.done{background:var(--acc3);}
.sdot.act{background:var(--acc);}
.sbody{padding:118px 20px 108px;}
.slbl{display:inline-flex;align-items:center;gap:5px;font-size:0.6rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--acc);background:rgba(124,111,255,0.09);border:1px solid rgba(124,111,255,0.2);border-radius:20px;padding:5px 12px;margin-bottom:14px;}
.step-scene{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r2);padding:15px 17px;margin-bottom:14px;font-size:0.85rem;line-height:1.8;}
.step-big{font-size:1.28rem;font-weight:800;text-align:center;line-height:1.4;margin-bottom:14px;padding:20px;background:linear-gradient(135deg,rgba(124,111,255,0.11),rgba(255,107,157,0.07));border-radius:var(--r2);border:1px solid rgba(124,111,255,0.18);}
.chunk{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r2);padding:14px 16px;margin-bottom:9px;}
.chunk-ph{font-size:0.91rem;font-weight:700;color:var(--acc);margin-bottom:5px;}
.chunk-kr{font-size:0.79rem;color:var(--mut);line-height:1.6;}
.pcard{background:linear-gradient(135deg,rgba(255,107,157,0.09),rgba(124,111,255,0.06));border:1px solid rgba(255,107,157,0.18);border-radius:var(--r2);padding:15px 17px;margin-bottom:10px;}
.pcard-lbl{font-size:0.6rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:7px;}
.pcard-main{font-size:0.98rem;font-weight:700;color:var(--acc2);font-style:italic;margin-bottom:10px;}
.pvar{font-size:0.79rem;padding:7px 12px;background:rgba(255,255,255,0.04);border-radius:10px;margin-bottom:5px;border-left:2px solid rgba(255,107,157,0.38);}
.gcard{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r2);padding:15px 17px;margin-bottom:10px;}
.ncard{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r2);padding:17px;margin-bottom:14px;}
.nbody{font-size:0.82rem;line-height:2;margin-bottom:13px;}
.sfooter{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 20px 28px;background:rgba(13,13,24,0.95);backdrop-filter:blur(20px);border-top:1px solid var(--bdr);z-index:401;}
.snext{width:100%;background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;border-radius:var(--r2);padding:16px;font-family:inherit;font-size:0.93rem;font-weight:800;color:white;cursor:pointer;box-shadow:0 8px 24px rgba(124,111,255,0.28);transition:all 0.2s;}
.snext:active{transform:scale(0.98);}
.snext:disabled{background:var(--surf2);color:var(--mut);box-shadow:none;cursor:default;}

/* QUIZ */
.qt-lbl{font-size:0.6rem;font-weight:700;letter-spacing:0.1em;color:var(--acc);text-transform:uppercase;margin-bottom:8px;}
.qscene{font-size:0.79rem;color:var(--mut);margin-bottom:13px;line-height:1.6;padding:10px 13px;background:var(--surf2);border-radius:11px;}
.qq{font-size:1.03rem;font-weight:700;line-height:1.5;margin-bottom:17px;text-align:center;padding:15px;background:var(--surf);border-radius:var(--r2);border:1px solid var(--bdr);}
.qblank{color:var(--acc);border-bottom:2px solid var(--acc);padding:0 4px;}
.qopts{margin-bottom:13px;}
.qopt{width:100%;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:13px 15px;margin-bottom:8px;font-family:inherit;font-size:0.85rem;font-weight:500;color:var(--txt);cursor:pointer;text-align:left;transition:all 0.2s;}
.qopt.ok{background:rgba(0,229,176,0.11);border-color:var(--acc3);color:var(--acc3);}
.qopt.no{background:rgba(255,80,80,0.09);border-color:rgba(255,80,80,0.38);color:rgba(255,110,110,0.88);}
.qopt:active{transform:scale(0.98);}
.qfb{border-radius:var(--r);padding:11px 15px;margin-bottom:13px;font-size:0.8rem;line-height:1.6;display:none;}
.qfb.show{display:block;}
.qfb.ok{background:rgba(0,229,176,0.07);border:1px solid rgba(0,229,176,0.22);color:var(--acc3);}
.qfb.no{background:rgba(255,80,80,0.06);border:1px solid rgba(255,80,80,0.22);color:rgba(255,110,110,0.88);}
.qnext{width:100%;background:var(--surf2);border:1px solid var(--bdr);border-radius:var(--r);padding:13px;font-family:inherit;font-size:0.85rem;font-weight:600;cursor:pointer;display:none;margin-top:4px;}
.qnext.show{display:block;}
.qdots{display:flex;gap:6px;margin-bottom:15px;}
.qdot{flex:1;height:4px;border-radius:2px;background:var(--surf2);}
.qdot.done{background:var(--acc3);}
.qdot.act{background:var(--acc);}

/* AI TUTOR */
.ai-topbar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:44px 20px 14px;background:rgba(13,13,24,0.97);backdrop-filter:blur(20px);z-index:501;border-bottom:1px solid var(--bdr);}
.ai-tb-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.ai-title{font-size:0.85rem;font-weight:800;}
.ai-title span{color:var(--acc2);}
.round-dots{display:flex;gap:8px;}
.rdot{width:10px;height:10px;border-radius:50%;background:var(--surf2);transition:all 0.3s;}
.rdot.done{background:var(--acc3);}
.rdot.act{background:var(--acc2);box-shadow:0 0 8px rgba(255,107,157,0.5);}
.ai-body{padding:118px 20px 108px;}
.ai-scene-box{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r2);padding:16px;margin-bottom:14px;}
.ai-scene-img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:var(--r);margin-bottom:12px;background:var(--surf2);}
.ai-scene-img-ph{width:100%;aspect-ratio:16/9;border-radius:var(--r);margin-bottom:12px;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:2rem;border:1px solid var(--bdr);}
.ai-situation{font-size:0.85rem;line-height:1.8;color:var(--txt);}
.ai-question-box{background:linear-gradient(135deg,rgba(255,107,157,0.12),rgba(124,111,255,0.08));border:1px solid rgba(255,107,157,0.22);border-radius:var(--r2);padding:18px;margin-bottom:16px;text-align:center;}
.ai-q-label{font-size:0.62rem;font-weight:700;letter-spacing:0.1em;color:var(--acc2);text-transform:uppercase;margin-bottom:8px;}
.ai-q-text{font-size:0.95rem;font-weight:700;line-height:1.6;color:var(--txt);}
.timer-box{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:20px;}
.timer-num{font-size:3rem;font-weight:900;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;min-width:60px;text-align:center;}
.timer-ring{width:64px;height:64px;position:relative;flex-shrink:0;}
.timer-ring svg{transform:rotate(-90deg);}
.timer-ring circle{fill:none;stroke:var(--surf2);stroke-width:4;}
.timer-ring .prog{stroke:var(--acc2);stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
.timer-msg{font-size:0.78rem;color:var(--mut);text-align:center;margin-bottom:16px;}
.answer-reveal{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r2);padding:18px;margin-bottom:14px;display:none;}
.answer-reveal.show{display:block;}
.ans-label{font-size:0.62rem;font-weight:700;letter-spacing:0.1em;color:var(--acc3);text-transform:uppercase;margin-bottom:10px;}
.ans-sentence{font-size:1.1rem;font-weight:800;color:var(--txt);margin-bottom:8px;}
.ans-phonetic{font-size:0.78rem;color:var(--acc);margin-bottom:6px;}
.ans-stress{font-size:0.85rem;font-weight:600;color:var(--acc2);margin-bottom:10px;font-family:monospace;}
.ans-exp{font-size:0.82rem;line-height:1.8;color:var(--txt);}
.input-box{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r2);padding:16px;margin-bottom:14px;}
.input-label{font-size:0.62rem;font-weight:700;letter-spacing:0.1em;color:var(--acc);text-transform:uppercase;margin-bottom:10px;}
.input-area{width:100%;background:var(--surf2);border:1.5px solid var(--bdr);border-radius:var(--r);padding:14px;font-family:inherit;font-size:0.9rem;color:var(--txt);outline:none;resize:none;line-height:1.6;min-height:60px;}
.input-area:focus{border-color:rgba(124,111,255,0.5);}
.submit-btn{width:100%;background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;border-radius:var(--r);padding:14px;font-family:inherit;font-size:0.88rem;font-weight:800;color:white;cursor:pointer;margin-top:10px;transition:all 0.2s;}
.submit-btn:active{transform:scale(0.98);}
.submit-btn:disabled{background:var(--surf2);color:var(--mut);cursor:default;}
.ai-feedback{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r2);padding:18px;margin-bottom:14px;display:none;}
.ai-feedback.show{display:block;}
.fb-level{font-size:1.1rem;font-weight:900;margin-bottom:10px;}
.fb-level.perfect{color:var(--acc3);}
.fb-level.good{color:var(--acc);}
.fb-level.retry{color:var(--gold);}
.fb-correction{background:var(--surf2);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;}
.fb-corr-label{font-size:0.6rem;font-weight:700;letter-spacing:0.1em;color:var(--mut);text-transform:uppercase;margin-bottom:5px;}
.fb-corr-text{font-size:0.88rem;font-weight:700;color:var(--txt);}
.fb-phonetic{font-size:0.76rem;color:var(--acc);margin-top:4px;}
.fb-stress{font-size:0.82rem;color:var(--acc2);font-family:monospace;margin-top:3px;}
.fb-exp{font-size:0.82rem;line-height:1.8;color:var(--txt);margin-bottom:8px;}
.fb-enc{font-size:0.8rem;color:var(--acc3);font-weight:600;}
.ai-loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:20px;color:var(--mut);font-size:0.82rem;}
.ai-loading-dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);animation:ldot 1.2s infinite;}
.ai-loading-dots span:nth-child(2){animation-delay:0.2s;}
.ai-loading-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes ldot{0%,80%,100%{transform:scale(0.5);opacity:0.4;}40%{transform:scale(1);opacity:1;}}
.ai-footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 20px 28px;background:rgba(13,13,24,0.97);backdrop-filter:blur(20px);border-top:1px solid var(--bdr);z-index:501;}
.ai-next{width:100%;background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;border-radius:var(--r2);padding:16px;font-family:inherit;font-size:0.93rem;font-weight:800;color:white;cursor:pointer;box-shadow:0 8px 24px rgba(124,111,255,0.28);transition:all 0.2s;display:none;}
.ai-next.show{display:block;}
.ai-next:active{transform:scale(0.98);}

/* GAMIFICATION */
.lvl-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.8);background:linear-gradient(135deg,rgba(20,20,40,0.98),rgba(30,20,50,0.98));border:1px solid rgba(124,111,255,0.4);border-radius:var(--r2);padding:32px 28px;text-align:center;z-index:600;opacity:0;transition:all 0.4s;pointer-events:none;min-width:260px;backdrop-filter:blur(30px);}
.lvl-popup.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto;}
.lvl-icon{font-size:3.5rem;margin-bottom:12px;}
.lvl-title{font-size:1.3rem;font-weight:900;margin-bottom:4px;}
.lvl-sub{font-size:0.82rem;color:var(--mut);margin-bottom:16px;}
.lvl-name{font-size:1rem;font-weight:800;background:linear-gradient(135deg,var(--gold),#ffaa44);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:16px;}
.lvl-close{background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;border-radius:var(--r);padding:12px 24px;font-family:inherit;font-size:0.88rem;font-weight:800;color:white;cursor:pointer;}
.xp-pop{position:fixed;top:88px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--acc),var(--acc2));color:white;border-radius:20px;padding:6px 16px;font-size:0.78rem;font-weight:800;z-index:600;opacity:0;transition:all 0.3s;pointer-events:none;}
.xp-pop.show{opacity:1;}
.lock-toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(14px);background:rgba(25,25,45,0.96);border:1px solid var(--bdr);border-radius:var(--r2);padding:13px 20px;font-size:0.8rem;text-align:center;backdrop-filter:blur(20px);z-index:600;opacity:0;transition:all 0.28s;pointer-events:none;max-width:260px;line-height:1.5;}
.lock-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* BADGES */
.badges-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
.badge-item{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:12px 8px;text-align:center;}
.badge-item.earned{border-color:rgba(255,209,102,0.3);background:rgba(255,209,102,0.05);}
.badge-icon{font-size:1.6rem;margin-bottom:4px;filter:grayscale(1);opacity:0.3;}
.badge-item.earned .badge-icon{filter:none;opacity:1;}
.badge-name{font-size:0.58rem;color:var(--mut);font-weight:600;}
.badge-item.earned .badge-name{color:var(--gold);}

/* STARS */
.stars-row{display:flex;justify-content:center;gap:8px;margin:10px 0;}
.star{font-size:2rem;filter:grayscale(1);opacity:0.3;transition:all 0.4s;}
.star.lit{filter:none;opacity:1;animation:starPop 0.4s ease;}
@keyframes starPop{0%{transform:scale(0.5)}60%{transform:scale(1.3)}100%{transform:scale(1)}}

/* CONFETTI */
.confetti-piece{position:fixed;width:8px;height:8px;border-radius:2px;z-index:700;pointer-events:none;animation:confettiFall 1.2s ease-out forwards;}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1;}100%{transform:translateY(100vh) rotate(720deg);opacity:0;}}

/* COMPLETE */
.cmp-wrap{text-align:center;padding:40px 20px;}
.cmp-icon{font-size:4.2rem;margin-bottom:15px;display:block;}
.cmp-title{font-size:1.45rem;font-weight:900;margin-bottom:5px;}
.cmp-score{font-size:2.8rem;font-weight:900;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:10px 0;}

/* STATS */
#stats-view{padding:110px 20px 100px;}
.sg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
.sc{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r2);padding:16px;text-align:center;}
.sn{font-size:1.9rem;font-weight:900;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:4px;}
.sl{font-size:0.68rem;color:var(--mut);}
.pr{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:12px 14px;margin-bottom:7px;display:flex;align-items:center;gap:10px;}
.pn{font-size:0.7rem;color:var(--mut);flex-shrink:0;width:22px;}
.ps{flex:1;font-size:0.79rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pst{font-size:0.73rem;font-weight:700;}
.pst.done{color:var(--acc3);}
.pst.pend{color:var(--mut);}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeUp 0.32s ease both;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
</style>
</head>
<body>
<div id="app">

<!-- OVERLAYS -->
<div class="lock-toast" id="lock-toast">🔒 이전 강의를 완료해야<br>열 수 있어요!</div>
<div class="xp-pop" id="xp-pop">+10 XP</div>
<div class="lvl-popup" id="lvl-popup">
  <div class="lvl-icon" id="lvl-icon">⭐</div>
  <div class="lvl-title" id="lvl-title">레벨 업!</div>
  <div class="lvl-sub" id="lvl-sub">레벨 2 달성</div>
  <div class="lvl-name" id="lvl-name">패턴 탐험가</div>
  <button class="lvl-close" onclick="closeLvlPopup()">계속하기 →</button>
</div>

<!-- PATH VIEW -->
<div class="view active" id="path-view">
  <div class="topbar">
    <div class="tb-row">
      <div class="logo"><span>FLUENCY</span></div>
      <div class="streak-badge">🔥 <span id="streak-num">0</span>일 연속</div>
    </div>
    <div class="xp-wrap">
      <div class="xp-meta"><span id="lvl-label">Lv.1 입문자</span><span id="xp-text">0 / 100 XP</span></div>
      <div class="xp-bar"><div class="xp-fill" id="xp-fill" style="width:0%"></div></div>
    </div>
  </div>
  <div class="path-wrap" id="path-wrap"></div>
</div>

<!-- DETAIL VIEW -->
<div class="fs" id="detail-view">
  <div class="dtopbar">
    <div class="back" onclick="closeDetail()">←</div>
    <div>
      <div style="font-size:0.68rem;color:var(--mut);" id="d-sub"></div>
      <div style="font-size:0.88rem;font-weight:700;" id="d-title"></div>
    </div>
  </div>
  <div class="dbody" id="d-body"></div>
</div>

<!-- STEP VIEW -->
<div class="fs" id="step-view">
  <div class="stopbar">
    <div class="st-row">
      <div class="st-lbl" id="st-lbl">STEP 1/5</div>
      <button class="exit-btn" onclick="exitStep()">✕ 종료</button>
    </div>
    <div class="sdots" id="sdots"></div>
  </div>
  <div class="sbody" id="sbody"></div>
  <div class="sfooter">
    <button class="snext" id="snext" onclick="nextStep()">다음 →</button>
  </div>
</div>

<!-- AI TUTOR VIEW -->
<div class="fs" id="ai-view" style="z-index:400;">
  <div class="ai-topbar">
    <div class="ai-tb-row">
      <div class="ai-title">🤖 AI <span>튜터</span></div>
      <div class="round-dots" id="round-dots"></div>
    </div>
    <div style="font-size:0.72rem;color:var(--mut);" id="ai-sub"></div>
  </div>
  <div class="ai-body" id="ai-body"></div>
  <div class="ai-footer">
    <button class="ai-next" id="ai-next" onclick="aiNext()">다음 →</button>
  </div>
</div>

<!-- STATS VIEW -->
<div class="view" id="stats-view">
  <div class="topbar">
    <div class="tb-row"><div class="logo"><span>진도</span></div></div>
  </div>
  <div class="sg">
    <div class="sc"><div class="sn" id="s-done">0</div><div class="sl">완료 강의</div></div>
    <div class="sc"><div class="sn" id="s-lv">1</div><div class="sl">현재 레벨</div></div>
    <div class="sc"><div class="sn" id="s-xp">0</div><div class="sl">총 XP</div></div>
    <div class="sc"><div class="sn" id="s-str">0</div><div class="sl">연속 학습일</div></div>
  </div>
  <div style="margin-bottom:12px;font-size:0.72rem;font-weight:700;color:var(--mut);letter-spacing:0.08em;">🏅 뱃지</div>
  <div class="badges-grid" id="badges-grid"></div>
  <div style="margin-bottom:12px;font-size:0.72rem;font-weight:700;color:var(--mut);letter-spacing:0.08em;">📚 강의 진도</div>
  <div id="prog-list"></div>
</div>

<!-- BOTTOM NAV -->
<nav class="bnav">
  <button class="nb active" id="nav-path" onclick="showNav('path')"><span class="nb-icon">🗺️</span>Path</button>
  <button class="nb" id="nav-stats" onclick="showNav('stats')"><span class="nb-icon">📊</span>진도</button>
  <button class="nb" id="nav-info" onclick="showNav('info')"><span class="nb-icon">ℹ️</span>정보</button>
</nav>

  {id:"L003",img:"IMG_003",cefr:"A2",s:"That's not like you at all.",ph:"댓츠 낫 라이크 유 앳 올",mn:"댓츠낫라이크유(그건 너답지 않아) / 앳올(전혀)",tts:"댓츠 낫 라이크 유. 앳 올.",scene:"친구가 평소와 다르게 약속을 펑크냈다. 나는 걱정과 놀라움으로 그 친구에게 말한다.",emo:"Anxiety",social:"Concern Expression",gr:"That is not like + 사람 구조로 상대방의 평소 성격과 다른 행동을 지적할 때 사용.",tb:"비난이 아닌 걱정의 뉘앙스로 사용해야 함. 화난 톤으로 쓰면 공격적으로 들릴 수 있음.",pt:"That's not like + [PERSON] + at all",vars:["That's not like him at all.","That's not like her to be so quiet.","That's not like you to give up so easily."],rels:["You're not yourself today.","This doesn't seem like you."],bq:{q:"That's not ___ you at all.",opts:["like","about","of","with"],a:0},sq:{sc:"평소에 항상 시간을 잘 지키는 친구가 오늘 갑자기 약속에 늦었다.",opts:["That's not like you at all.","You're always late anyway.","I knew you'd be late."],a:0},vq:{stem:"That's not like ___ at all.",acc:["you","him","her","them"]},nr:"이 표현은 상대방이 평소와 다른 행동을 할 때 걱정을 담아 말하는 표현입니다. 낫 라이크 유는 너답지 않다는 뜻입니다. 비난이 아니라 걱정과 관심을 담아서 말하는 표현이에요.",cen:"Sometimes caring sounds like this.",ckr:"때로는 걱정이 이런 말로 나와요.",slot_acc:["him","her","them","us"]},

// ══ STATE ══
let S=JSON.parse(localStorage.getItem('fluency_v4')||'{"done":[],"xp":0,"streak":0,"lastStudy":"","quiz_scores":{},"tutor_done":0}');
function save(){localStorage.setItem('fluency_v4',JSON.stringify(S));}
function unlocked(i){return i===0||S.done.includes(L[i-1].id);}
function getLv(){return LEVELS.slice().reverse().find(l=>S.xp>=l.xp)||LEVELS[0];}
function getNextLv(){const c=getLv();const ni=LEVELS.findIndex(l=>l.lv===c.lv);return LEVELS[ni+1]||null;}

// ══ XP & GAMIFICATION ══
function addXP(n,label=''){
  const prevLv=getLv();
  S.xp+=n; save();
  const newLv=getLv();
  updateBars();
  // XP 팝업
  const p=document.getElementById('xp-pop');
  p.textContent=`+${n} XP ${label}`;
  p.classList.add('show');
  setTimeout(()=>p.classList.remove('show'),1400);
  // 레벨업 체크
  if(newLv.lv>prevLv.lv) showLvlUp(newLv);
}
function showLvlUp(lv){
  document.getElementById('lvl-icon').textContent=lv.icon;
  document.getElementById('lvl-title').textContent='레벨 업!';
  document.getElementById('lvl-sub').textContent=`레벨 ${lv.lv} 달성`;
  document.getElementById('lvl-name').textContent=lv.name;
  document.getElementById('lvl-popup').classList.add('show');
}
function closeLvlPopup(){document.getElementById('lvl-popup').classList.remove('show');}
function updateBars(){
  const lv=getLv(), next=getNextLv();
  const baseXP=lv.xp, nextXP=next?next.xp:lv.xp+100;
  const pct=Math.min(100,((S.xp-baseXP)/(nextXP-baseXP))*100);
  document.getElementById('xp-fill').style.width=pct+'%';
  document.getElementById('xp-text').textContent=`${S.xp} / ${nextXP} XP`;
  document.getElementById('lvl-label').textContent=`${lv.icon} Lv.${lv.lv} ${lv.name}`;
  document.getElementById('streak-num').textContent=S.streak||0;
}
function confetti(){
  const colors=['#7c6fff','#ff6b9d','#00e5b0','#ffd166','#fff'];
  for(let i=0;i<40;i++){
    const el=document.createElement('div');
    el.className='confetti-piece';
    el.style.cssText=`left:${Math.random()*100}vw;top:${Math.random()*30}vh;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${0.8+Math.random()*0.8}s;animation-delay:${Math.random()*0.3}s;transform:rotate(${Math.random()*360}deg);`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),2000);
  }
  if(navigator.vibrate) navigator.vibrate([50,30,50]);
}
function playSound(type){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    if(type==='correct'){o.frequency.setValueAtTime(523,ctx.currentTime);o.frequency.setValueAtTime(659,ctx.currentTime+0.1);o.frequency.setValueAtTime(784,ctx.currentTime+0.2);g.gain.setValueAtTime(0.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.5);}
    else{o.frequency.setValueAtTime(300,ctx.currentTime);g.gain.setValueAtTime(0.2,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3);}
    o.start();o.stop(ctx.currentTime+0.5);
  }catch(e){}
}
function checkBadges(){
  BADGES.forEach(b=>{
    if(!S.badges) S.badges={};
    if(!S.badges[b.id]&&b.cond(S)){
      S.badges[b.id]=true; save();
      setTimeout(()=>{
        const p=document.getElementById('xp-pop');
        p.textContent=`🏅 뱃지 획득: ${b.name}`;
        p.classList.add('show');
        setTimeout(()=>p.classList.remove('show'),2000);
      },1500);
    }
  });
}

  const c=document.getElementById('path-wrap');
  let h='';
  L.forEach((l,i)=>{
    const done=S.done.includes(l.id);
    const cur=!done&&unlocked(i);
    const lk=!done&&!cur;
    const cls=done?'done':cur?'cur':'lk';
    const icon=done?'✓':cur?(EICON[l.emo]||'📖'):'🔒';
    const num=String(i+1).padStart(3,'0');
    const bub=cur?`<div class="bubble">시작</div>`:'';
    h+=`<div class="node-wrap fade-in" style="animation-delay:${i*0.055}s">
      <div class="node ${cls}" onclick="nodeClick(${i})">
        <div class="node-icon">${icon}</div>
        <div class="node-num">${num}</div>${bub}
      </div></div>`;
    if(i<L.length-1){
      const nl=!done&&lk;
      h+=`<div class="connector ${nl?'lk':''}"></div>`;
    }
    if(i===4){
      const all5=L.slice(0,5).every(x=>S.done.includes(x.id));
      if(all5)h+=`<div class="milestone">🏆 전반전 완주! +50 XP 달성</div>`;
    }
  });
  c.innerHTML=h;
  updateBars();
}
function nodeClick(i){

  openDetail(i);
}

function sp(t,lang){

// ══ STEP ══
const STEPS=[
  {id:'exposure',name:'첫 노출',icon:'🎬'},
  {id:'meaning',name:'의미 파악',icon:'🔊'},
  {id:'pattern',name:'패턴 인식',icon:'🧩'},
  {id:'emotion',name:'감정 결합',icon:'🎙️'},
  {id:'quiz',name:'능동 회상',icon:'🎯'},
];
let si=0,qi=0,qs=0,qd=[];

function startStep(i){
  ci=i;si=0;qi=0;qs=0;
  document.getElementById('step-view').classList.add('active');
  renderStep(); window.scrollTo(0,0);
}
function exitStep(){
  if(!confirm('학습을 종료할까요?\n진도는 저장되지 않습니다.'))return;
  document.getElementById('step-view').classList.remove('active');
  window.scrollTo(0,0);
}
function nextStep(){si++;if(si>=STEPS.length){finalComplete();return;}renderStep();window.scrollTo(0,0);}
function renderStep(){
  const l=L[ci],s=STEPS[si];
  document.getElementById('sdots').innerHTML=STEPS.map((_,i)=>`<div class="sdot ${i<si?'done':i===si?'act':''}"></div>`).join('');
  document.getElementById('st-lbl').textContent=`${s.icon} ${s.name}  ${si+1}/${STEPS.length}`;
  const btn=document.getElementById('snext');
  btn.disabled=false;btn.onclick=nextStep;btn.textContent=si<STEPS.length-1?'다음 →':'완료 ✓';
  const body=document.getElementById('sbody');
  const img=`<img class="simg" src="images/${l.img}.jpg" onerror="this.outerHTML='<div class=\\"simg-ph\\">🎬</div>'" alt="">`;

  if(s.id==='exposure'){
    body.innerHTML=`<div class="slbl">🎬 첫 노출</div>${img}<div class="step-scene">${l.scene}</div><div class="step-big">${l.s}</div>`;
  }else if(s.id==='meaning'){
    btn.disabled=true;btn.textContent='🔊 영어 듣기를 먼저 눌러주세요';
    const chunks=l.mn.split(' / ').map(c=>{const m=c.match(/^(.+?)\((.+?)\)$/);return m?`<div class="chunk"><div class="chunk-ph">${m[1]}</div><div class="chunk-kr">${m[2]}</div></div>`:`<div class="chunk"><div class="chunk-ph">${c}</div></div>`;}).join('');
    body.innerHTML=`<div class="slbl">🔊 의미 파악</div><div class="step-big">${l.s}</div><div class="tts-row" style="margin-bottom:14px;"><button class="ttsb en" onclick="sSp('${e(l.s)}','en')">🔊 영어 듣기</button><button class="ttsb kr" onclick="sSp('${e(l.tts)}','ko')">🔊 발음 듣기</button></div>${chunks}`;
  }else if(s.id==='pattern'){
    body.innerHTML=`<div class="slbl">🧩 패턴 인식</div><div class="pcard"><div class="pcard-lbl" style="color:var(--acc2);">핵심 패턴</div><div class="pcard-main">${l.pt}</div>${l.vars.map(v=>`<div class="pvar">• ${v}</div>`).join('')}</div><div class="gcard"><div class="pcard-lbl" style="color:var(--acc);">문법 포인트</div><div class="gr-txt" style="margin-bottom:8px;">${l.gr}</div><div class="taboo">⚠️ ${l.tb}</div></div>`;
  }else if(s.id==='emotion'){
    btn.disabled=true;btn.textContent='🎙️ 나레이션을 먼저 들어주세요';
    body.innerHTML=`<div class="slbl">🎙️ 감정 결합</div>${img}<div class="ncard"><div class="nbody">${l.nr}</div><button class="tts-full" onclick="sSp('${e(l.nr)}','ko')">🎙️ 나레이션 듣기</button></div><div class="closing"><div class="closing-en">"${l.cen}"</div><div class="closing-kr">${l.ckr}</div></div>`;
  }else if(s.id==='quiz'){
    btn.disabled=true;btn.textContent='퀴즈를 완료해주세요';
    qi=0;qs=0;
    qd=[{t:'blank',q:l.bq},{t:'sit',q:l.sq},{t:'var',q:l.vq}];
    renderQ();
  }
}
function sSp(t,lang){
  sp(t,lang);
  setTimeout(()=>{const b=document.getElementById('snext');if(b.disabled){b.disabled=false;b.textContent=si<STEPS.length-1?'다음 →':'완료 ✓';}},700);
}

// ── QUIZ ──
function renderQ(){
  const body=document.getElementById('sbody');
  if(qi>=qd.length){renderQDone();return;}
  const q=qd[qi];
  const dots=qd.map((_,i)=>`<div class="qdot ${i<qi?'done':i===qi?'act':''}"></div>`).join('');
  let h=`<div class="slbl">🎯 능동 회상</div><div class="qdots">${dots}</div>`;
  if(q.t==='blank'){
    const opts=shuffle(q.q.opts);
    const qT=q.q.q.replace(/_+/g,'<span class="qblank">___</span>');
    h+=`<div class="qt-lbl">🔤 빈칸 채우기</div><div class="qq">${qT}</div><div class="qopts">${opts.map(o=>`<button class="qopt" onclick="cB(this,'${e(o)}','${e(q.q.opts[q.q.a])}')">${o}</button>`).join('')}</div>`;
  }else if(q.t==='sit'){
    h+=`<div class="qt-lbl">🎭 상황 판단</div><div class="qscene">📍 ${q.q.sc}</div><div class="qq">이 상황에서 가장 자연스러운 표현은?</div><div class="qopts">${q.q.opts.map((o,i)=>`<button class="qopt" onclick="cS(this,${i},${q.q.a})">${o}</button>`).join('')}</div>`;
  }else{
    h+=`<div class="qt-lbl">✏️ 변형 완성</div><div class="qq">"${q.q.stem}"<br><small style="color:var(--mut);font-size:0.72rem;">빈칸에 들어갈 표현을 입력하세요</small></div><input id="vi" type="text" placeholder="영어로 입력..." style="width:100%;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;font-family:inherit;font-size:0.9rem;color:var(--txt);margin-bottom:12px;outline:none;"><button class="qopt" onclick="cV()" style="text-align:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:white;border:none;font-weight:700;">확인하기</button>`;
  }
  h+=`<div class="qfb" id="qfb"></div><button class="qnext" id="qnb" onclick="qNext()">다음 →</button>`;
  body.innerHTML=h;
}
function cB(btn,sel,correct){
  document.querySelectorAll('.qopt').forEach(b=>b.disabled=true);
  const ok=sel.toLowerCase()===correct.toLowerCase();
  btn.classList.add(ok?'ok':'no');
  if(!ok)document.querySelectorAll('.qopt').forEach(b=>{if(b.textContent===correct)b.classList.add('ok');});
  fb(ok,correct);
  if(ok){qs++;addXP(10);playSound('correct');if(qs===3)confetti();}
  else playSound('wrong');
}
function cS(btn,idx,a){
  document.querySelectorAll('.qopt').forEach(b=>b.disabled=true);
  const ok=idx===a;
  btn.classList.add(ok?'ok':'no');
  if(!ok)document.querySelectorAll('.qopt')[a].classList.add('ok');
  fb(ok,qd[qi].q.opts[a]);
  if(ok){qs++;addXP(10);playSound('correct');}
  else playSound('wrong');
}
function cV(){
  const inp=document.getElementById('vi');
  const val=inp.value.trim().toLowerCase();
  const acc=qd[qi].q.acc.map(a=>a.toLowerCase());
  const ok=acc.some(a=>val.includes(a)||a.includes(val));
  inp.style.borderColor=ok?'var(--acc3)':'rgba(255,80,80,0.5)';
  document.querySelector('[onclick="cV()"]').style.display='none';
  fb(ok,qd[qi].q.acc[0]);
  if(ok){qs++;addXP(10);playSound('correct');}
  else playSound('wrong');
}
function fb(ok,correct){
  const el=document.getElementById('qfb');
  el.className=`qfb show ${ok?'ok':'no'}`;
  el.innerHTML=ok?`✅ 정확해요! <b>${correct}</b>`:`❌ 정답: <b>${correct}</b>`;
  document.getElementById('qnb').classList.add('show');
}
function qNext(){qi++;renderQ();window.scrollTo(0,0);}
function renderQDone(){
  const pct=Math.round((qs/qd.length)*100);
  const pass=pct>=67;
  const stars=pct===100?3:pass?2:1;
  const starHtml=Array.from({length:3},(_,i)=>`<span class="star ${i<stars?'lit':''}">⭐</span>`).join('');
  S.quiz_scores=S.quiz_scores||{};
  S.quiz_scores[L[ci].id]=qs;
  save();
  if(pass)confetti();
  document.getElementById('sbody').innerHTML=`
    <div class="cmp-wrap fade-in">
      <span class="cmp-icon">${pct===100?'🎉':pass?'👍':'💪'}</span>
      <div class="cmp-title">${pct===100?'완벽해요!':pass?'잘했어요!':'다시 도전!'}</div>
      <div class="stars-row">${starHtml}</div>
      <div class="cmp-score">${qs}/${qd.length}</div>
      <div style="font-size:0.8rem;color:var(--mut);">+${qs*10} XP 획득</div>
    </div>`;
  const btn=document.getElementById('snext');
  btn.disabled=false;
  if(pass){btn.textContent='습득 완료 ✓';}
  else{
    btn.textContent='🔄 퀴즈 다시 풀기';
    btn.onclick=()=>{qi=0;qs=0;renderQ();window.scrollTo(0,0);btn.onclick=nextStep;};
  }
}
function finalComplete(){
  const l=L[ci];
  if(!S.done.includes(l.id)){
    S.done.push(l.id);
    const today=new Date().toDateString();
    const yest=new Date(Date.now()-86400000).toDateString();
    if(S.lastStudy!==today){S.streak=S.lastStudy===yest?(S.streak||0)+1:1;S.lastStudy=today;}
    if(S.done.length===5)addXP(50,'🏆');
    if(S.done.length===10){addXP(100,'👑');confetti();}
    save(); checkBadges();
  }
  document.getElementById('sbody').innerHTML=`
    <div class="cmp-wrap fade-in">
      <span class="cmp-icon">🎓</span>
      <div class="cmp-title">습득 완료!</div>
      <div style="background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r2);padding:16px;margin:14px 0;">
        <div style="font-size:0.68rem;color:var(--mut);margin-bottom:5px;">오늘 습득한 표현</div>
        <div style="font-size:0.98rem;font-weight:700;color:var(--acc2);">${l.s}</div>
      </div>
      <div style="font-size:0.83rem;color:var(--mut);line-height:1.8;margin-bottom:16px;">${l.ckr}<br><i style="color:var(--acc);">"${l.cen}"</i></div>
      ${S.done.length<L.length?`<div style="font-size:0.8rem;color:var(--acc3);margin-bottom:14px;">🔓 다음 표현이 열렸어요!</div>`:'<div style="font-size:0.8rem;color:var(--gold);margin-bottom:14px;">🏆 모든 표현을 습득했어요!</div>'}
      <button class="sbtn sec-btn" onclick="goAI()" style="margin-bottom:0;">🤖 AI 튜터와 연습하기</button>
    </div>`;
  const btn=document.getElementById('snext');
  btn.disabled=false;btn.textContent='← 목록으로';
  btn.onclick=()=>{
    document.getElementById('step-view').classList.remove('active');
    document.getElementById('detail-view').classList.remove('active');
    renderPath();btn.onclick=nextStep;window.scrollTo(0,0);
  };
}
function goAI(){
  document.getElementById('step-view').classList.remove('active');
  startAI(ci);
}

function startTimer(sec,cb){
  let t=sec;
  const numEl=document.getElementById('timer-num');
  const progEl=document.getElementById('timer-prog');
  const circumference=175.9;
  const iv=setInterval(()=>{
    t--;
    if(numEl)numEl.textContent=t;
    if(progEl)progEl.style.strokeDashoffset=(circumference*(1-t/sec))+'';
    if(t<=0){clearInterval(iv);cb();}
  },1000);
}

    <div class="ai-question-box">

      <div class="ai-q-text">"${l.scene}"<br><br>이 상황에서 영어로 뭐라고 할까요?</div>
    </div>
    <div class="input-box">
      <div class="input-label">내 답변</div>
      <textarea class="input-area" id="user-input" placeholder="영어로 입력해보세요..." rows="3"></textarea>
      <button class="submit-btn" id="submit-btn" onclick="submitRound2()">제출하기 →</button>
    </div>
    <div class="ai-feedback" id="ai-fb"></div>
  `;
}

async function submitRound2(){
  const inp=document.getElementById('user-input');
  const val=inp.value.trim();
  if(!val)return;
  const btn=document.getElementById('submit-btn');
  btn.disabled=true; btn.textContent='AI가 분석 중…';
  const l=aiL;

  const prompt=`당신은 한국인 영어 학습자의 답변을 평가하는 AI 튜터입니다.
목표 문장: "${l.s}"
학습자 입력: "${val}"
발음 표기 스타일 (참고): ${l.ph}

평가 기준:
- PERFECT: 목표 문장과 동일하거나 의미적으로 완전히 일치
- GOOD: 의미는 통하지만 표현이 약간 다름
- TRY_AGAIN: 의미가 많이 다르거나 핵심 표현 누락

반드시 아래 JSON만 출력. 다른 텍스트 없이:
{"level":"PERFECT|GOOD|TRY_AGAIN","correction":"(교정된 문장)","phonetic":"(한글 발음 표기)","stress":"(강세 표시. 핵심 단어 대문자)","explanation_kr":"(왜 이렇게 말하는지 한글로 2문장 이내)","encouragement_kr":"(칭찬 또는 격려 한 문장. 틀렸다는 단어 사용 금지)"}`;

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:400,messages:[{role:'user',content:prompt}]})
    });
    const data=await res.json();
    const txt=data.content[0].text.replace(/```json|```/g,'').trim();
    const ai=JSON.parse(txt);
    aiData.round2=ai;

    const lvColor=ai.level==='PERFECT'?'perfect':ai.level==='GOOD'?'good':'retry';
    const lvText=ai.level==='PERFECT'?'🎉 완벽해요!':ai.level==='GOOD'?'👍 잘했어요!':'💪 조금만 더!';
    if(ai.level==='PERFECT'){confetti();playSound('correct');addXP(20,'');}
    else if(ai.level==='GOOD'){playSound('correct');addXP(10,'');}

    const fbEl=document.getElementById('ai-fb');
    fbEl.classList.add('show');
    fbEl.innerHTML=`
      <div class="fb-level ${lvColor}">${lvText}</div>
      <div class="fb-correction">
        <div class="fb-corr-label">모범 표현</div>
        <div class="fb-corr-text">${ai.correction}</div>
        <div class="fb-phonetic">${ai.phonetic}</div>
        <div class="fb-stress">${ai.stress}</div>
      </div>
      <div class="fb-exp">${ai.explanation_kr}</div>
      <div class="fb-enc">💬 ${ai.encouragement_kr}</div>
      <button class="ttsb en" style="width:100%;margin-top:12px;justify-content:center;" onclick="sp('${e(ai.correction)}','en')">🔊 정답 발음 듣기</button>
    `;
    const nextBtn=document.getElementById('ai-next');
    nextBtn.textContent='다음 → 변형 도전';
    nextBtn.classList.add('show');
  }catch(err){
    btn.disabled=false;btn.textContent='제출하기 →';
  }
}

// ── ROUND 3: 변형 ──
async function loadAIRound3(){
  const l=aiL;
  const body=document.getElementById('ai-body');
  const nextBtn=document.getElementById('ai-next');
  nextBtn.classList.remove('show');
  renderRoundDots();

  // 슬롯에서 랜덤 선택
  const slotAcc=l.slot_acc||l.vq.acc;
  const pick=slotAcc[Math.floor(Math.random()*slotAcc.length)];

  body.innerHTML=`<div class="ai-loading"><div class="ai-loading-dots"><span></span><span></span><span></span></div> 변형 문제 생성 중…</div>`;

  const prompt=`당신은 한국인 영어 학습자를 위한 AI 튜터입니다.
패턴: "${l.pt}"
원래 문장: "${l.s}"
변형 키워드: "${pick}"

이 패턴으로 "${pick}"을 활용한 새로운 문장 변형을 연습시키세요.
한글 상황을 제시하고 학습자가 변형 문장을 쓰도록 유도하세요.

반드시 아래 JSON만 출력:
{"situation_kr":"(새 상황 한글 1~2문장)","target_variation":"(목표 변형 문장)","hint_kr":"(패턴 힌트. 답은 주지 말 것)"}`;

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:300,messages:[{role:'user',content:prompt}]})
    });
    const data=await res.json();
    const txt=data.content[0].text.replace(/```json|```/g,'').trim();
    const ai=JSON.parse(txt);
    aiData.round3=ai;

    body.innerHTML=`
      <div class="ai-question-box">
        <div class="ai-q-label">🔄 라운드 3 — 패턴 변형</div>
        <div class="ai-q-text">${ai.situation_kr}</div>
      </div>
      <div style="background:rgba(124,111,255,0.08);border:1px solid rgba(124,111,255,0.18);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:0.8rem;color:var(--mut);">
        💡 힌트: ${ai.hint_kr}
      </div>
      <div class="input-box">
        <div class="input-label">변형 문장 써보기</div>
        <textarea class="input-area" id="var-input" placeholder="영어로 입력해보세요..." rows="3"></textarea>
        <button class="submit-btn" id="var-btn" onclick="submitRound3('${e(ai.target_variation)}')">제출하기 →</button>
      </div>
      <div class="ai-feedback" id="var-fb"></div>
    `;
  }catch(err){
    body.innerHTML=`<div style="text-align:center;padding:30px;color:var(--mut);">⚠️ 문제 생성에 실패했어요.</div>`;
    nextBtn.textContent='완료하기 →';
    nextBtn.classList.add('show');
  }

async function submitRound3(target){
  const inp=document.getElementById('var-input');
  const val=inp.value.trim();
  if(!val)return;
  const btn=document.getElementById('var-btn');
  btn.disabled=true;btn.textContent='분석 중…';
  const l=aiL;

  const prompt=`목표 변형 문장: "${target}"
학습자 입력: "${val}"
원래 패턴: "${l.pt}"

평가: 의미적으로 유사하면 통과. 패턴 구조 사용했으면 가점.
JSON만 출력:
{"pass":true|false,"feedback_kr":"(구체적인 피드백 한글 2문장)","encouragement_kr":"(격려 한 문장)"}`;

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:250,messages:[{role:'user',content:prompt}]})
    });
    const data=await res.json();
    const txt=data.content[0].text.replace(/```json|```/g,'').trim();
    const ai=JSON.parse(txt);

    if(ai.pass){confetti();playSound('correct');addXP(15,'');}
    else playSound('wrong');

    const fbEl=document.getElementById('var-fb');
    fbEl.classList.add('show');
    fbEl.innerHTML=`
      <div class="fb-level ${ai.pass?'perfect':'retry'}">${ai.pass?'🎉 패턴 마스터!':'💪 한 번 더!'}</div>
      <div class="fb-correction">
        <div class="fb-corr-label">목표 문장</div>
        <div class="fb-corr-text">${target}</div>
      </div>
      <div class="fb-exp">${ai.feedback_kr}</div>
      <div class="fb-enc">💬 ${ai.encouragement_kr}</div>
      <button class="ttsb en" style="width:100%;margin-top:12px;justify-content:center;" onclick="sp('${e(target)}','en')">🔊 듣기</button>
    `;
    const nextBtn=document.getElementById('ai-next');
    nextBtn.textContent='튜터 세션 완료 ✓';
    nextBtn.classList.add('show');
  }catch(err){
    btn.disabled=false;btn.textContent='제출하기 →';
  }
}

function aiComplete(){
  S.tutor_done=(S.tutor_done||0)+1;
  addXP(25,'🤖 AI 튜터');
  save(); checkBadges();
  const body=document.getElementById('ai-body');
  body.innerHTML=`
    <div class="cmp-wrap fade-in">
      <span class="cmp-icon">🤖</span>
      <div class="cmp-title">AI 튜터 완료!</div>
      <div style="font-size:0.85rem;color:var(--mut);line-height:1.8;margin:16px 0;">
        3라운드 모두 완료했어요.<br>
        <i style="color:var(--acc);">"${aiL.cen}"</i>
      </div>
      <div style="font-size:0.8rem;color:var(--acc3);margin-bottom:16px;">+25 XP 획득</div>
    </div>
  `;
  const nextBtn=document.getElementById('ai-next');
  nextBtn.textContent='← 목록으로';
  nextBtn.classList.add('show');
  nextBtn.onclick=()=>{
    document.getElementById('ai-view').classList.remove('active');
    document.getElementById('detail-view').classList.remove('active');
    renderPath(); nextBtn.onclick=aiNext; window.scrollTo(0,0);
  };
}

// ══ NAV ══
function showNav(v){
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+v).classList.add('active');
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  if(v==='path')document.getElementById('path-view').classList.add('active');
  else if(v==='stats'){document.getElementById('stats-view').classList.add('active');renderStats();}
  window.scrollTo(0,0);
}
function renderStats(){
  const lv=getLv();
  document.getElementById('s-done').textContent=S.done.length;
  document.getElementById('s-lv').textContent=lv.lv;
  document.getElementById('s-xp').textContent=S.xp||0;
  document.getElementById('s-str').textContent=S.streak||0;
  document.getElementById('badges-grid').innerHTML=BADGES.map(b=>{
    const earned=S.badges&&S.badges[b.id];
    return `<div class="badge-item ${earned?'earned':''}"><div class="badge-icon">${b.icon}</div><div class="badge-name">${b.name}</div></div>`;
  }).join('');
  document.getElementById('prog-list').innerHTML=L.map((l,i)=>{
    const done=S.done.includes(l.id);
    const ul=unlocked(i);
    return `<div class="pr"><span class="pn">${String(i+1).padStart(2,'0')}</span><span class="ps">${l.s}</span><span class="pst ${done?'done':'pend'}">${done?'✅':ul?'🔓':'🔒'}</span></div>`;
  }).join('');
}

// ══ UTIL ══
function shuffle(a){return[...a].sort(()=>Math.random()-0.5);}
function e(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');}

renderPath();
</script>
