<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0d18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FLUENCY</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d18;--surface:#16162a;--surface2:#1e1e35;--border:rgba(255,255,255,0.07);
  --text:#f0f0f8;--muted:#6060a0;--accent:#7c6fff;--accent2:#ff6b9d;--accent3:#00e5b0;
  --gold:#ffd166;--locked:#2a2a42;--r:16px;--r2:24px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Sora','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;}
.view{display:none;min-height:100vh;}
.view.active{display:block;}
.fullscreen{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:300;overflow-y:auto;display:none;}
.fullscreen.active{display:block;}

/* TOP BAR */
.top-bar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:44px 20px 14px;background:rgba(13,13,24,0.93);backdrop-filter:blur(20px);z-index:200;border-bottom:1px solid var(--border);}
.top-bar-row{display:flex;align-items:center;justify-content:space-between;}
.logo-text{font-size:1.3rem;font-weight:900;letter-spacing:-0.05em;}
.logo-text span{background:linear-gradient(135deg,#7c6fff,#ff6b9d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.streak-badge{display:flex;align-items:center;gap:5px;background:rgba(255,209,102,0.1);border:1px solid rgba(255,209,102,0.22);border-radius:20px;padding:5px 12px;font-size:0.72rem;font-weight:700;color:var(--gold);}
.xp-bar-wrap{margin-top:10px;}
.xp-label{font-size:0.6rem;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between;}
.xp-bar{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width 0.5s;}

/* PATH */
#path-view{padding:110px 0 100px;}
.path-container{padding:0 30px;position:relative;}
.path-connector{width:3px;height:44px;margin:0 auto;border-radius:2px;background:linear-gradient(180deg,rgba(124,111,255,0.5),transparent);}
.path-connector.locked{background:linear-gradient(180deg,rgba(60,60,80,0.5),transparent);}
.path-node-wrap{display:flex;justify-content:center;position:relative;}
.path-node-wrap:nth-child(4n+1) .path-node{margin-left:0;}
.path-node-wrap:nth-child(4n+3) .path-node{margin-left:-80px;}
.path-node-wrap:nth-child(4n+5) .path-node{margin-left:0;}
.path-node-wrap:nth-child(4n+7) .path-node{margin-left:80px;}

.path-node{position:relative;width:78px;height:78px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform 0.2s;flex-shrink:0;}
.path-node:active{transform:scale(0.9)!important;}
.path-node.done{background:linear-gradient(145deg,#00e5b0,#00b880);box-shadow:0 5px 20px rgba(0,229,176,0.3),0 0 0 4px rgba(0,229,176,0.12);}
.path-node.current{background:linear-gradient(145deg,#7c6fff,#ff6b9d);box-shadow:0 6px 26px rgba(124,111,255,0.5),0 0 0 5px rgba(124,111,255,0.18);animation:glow 2s infinite;}
@keyframes glow{0%,100%{box-shadow:0 6px 26px rgba(124,111,255,0.5),0 0 0 5px rgba(124,111,255,0.18);}50%{box-shadow:0 6px 26px rgba(124,111,255,0.7),0 0 0 9px rgba(124,111,255,0.1);}}
.path-node.locked{background:var(--locked);box-shadow:none;cursor:default;}
.path-node.locked:active{transform:none!important;}
.node-icon{font-size:1.55rem;line-height:1;}
.node-num{font-size:0.58rem;font-weight:800;opacity:0.75;margin-top:2px;letter-spacing:0.04em;}
.node-bubble{position:absolute;background:white;color:#1a1a2e;border-radius:12px;padding:6px 13px;font-size:0.76rem;font-weight:800;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,0.25);pointer-events:none;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);}
.node-bubble::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:white;border-bottom:0;}
.milestone{display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,rgba(255,209,102,0.1),rgba(255,107,157,0.06));border:1px solid rgba(255,209,102,0.18);border-radius:var(--r2);padding:13px 18px;margin:14px 10px;font-size:0.78rem;font-weight:700;color:var(--gold);}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(13,13,24,0.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 16px 22px;gap:4px;z-index:200;}
.nav-btn{background:none;border:none;font-family:inherit;font-size:0.63rem;font-weight:700;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;border-radius:12px;transition:all 0.2s;}
.nav-icon{font-size:1.2rem;}
.nav-btn.active{color:var(--accent);}

/* DETAIL */
.detail-topbar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:44px 20px 14px;background:rgba(13,13,24,0.95);backdrop-filter:blur(20px);z-index:301;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.back-btn{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.1rem;flex-shrink:0;}
.detail-info-sub{font-size:0.68rem;color:var(--muted);}
.detail-info-title{font-size:0.88rem;font-weight:700;}
.detail-body{padding:110px 20px 100px;}
.scene-img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:var(--r2);margin-bottom:16px;background:var(--surface2);}
.scene-img-ph{width:100%;aspect-ratio:16/9;border-radius:var(--r2);margin-bottom:16px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:2.5rem;border:1px solid var(--border);}
.sentence-hero{background:linear-gradient(135deg,rgba(124,111,255,0.13),rgba(255,107,157,0.07));border:1px solid rgba(124,111,255,0.2);border-radius:var(--r2);padding:20px;text-align:center;margin-bottom:14px;}
.sentence-hero-text{font-size:1.18rem;font-weight:800;line-height:1.4;margin-bottom:8px;}
.phonetic{font-size:0.76rem;color:var(--accent);margin-bottom:6px;letter-spacing:0.02em;}
.meaning{font-size:0.72rem;color:var(--muted);line-height:1.6;}
.tts-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.tts-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-family:inherit;font-size:0.77rem;font-weight:600;color:var(--text);transition:all 0.2s;}
.tts-btn.en{border-color:rgba(124,111,255,0.4);color:var(--accent);}
.tts-btn.kr{border-color:rgba(0,229,176,0.38);color:var(--accent3);}
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:16px;margin-bottom:12px;}
.sec-label{font-size:0.6rem;font-weight:700;letter-spacing:0.1em;color:var(--muted);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.sec-label::before{content:'';width:3px;height:11px;border-radius:2px;background:linear-gradient(var(--accent),var(--accent2));}
.scene-text{font-size:0.83rem;line-height:1.8;color:var(--text);}
.grammar-text{font-size:0.81rem;line-height:1.7;color:var(--text);margin-bottom:8px;}
.taboo-box{background:rgba(255,209,102,0.06);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:9px 13px;font-size:0.75rem;color:var(--gold);line-height:1.6;}
.var-item{font-size:0.79rem;padding:8px 12px;background:var(--surface2);border-radius:10px;margin-bottom:5px;color:var(--text);border-left:3px solid rgba(124,111,255,0.38);}
.rel-item{font-size:0.76rem;padding:7px 12px;background:var(--surface2);border-radius:10px;margin-bottom:5px;color:var(--muted);border-left:3px solid rgba(0,229,176,0.28);}
.pattern-text{font-size:0.87rem;font-weight:700;color:var(--accent2);font-style:italic;margin-bottom:8px;}
.narration-text{font-size:0.81rem;line-height:1.9;color:var(--text);margin-bottom:12px;}
.closing-box{background:linear-gradient(135deg,rgba(124,111,255,0.09),rgba(255,107,157,0.06));border-radius:12px;padding:12px 14px;text-align:center;}
.closing-en{font-size:0.83rem;font-weight:600;color:var(--accent);margin-bottom:4px;font-style:italic;}
.closing-kr{font-size:0.72rem;color:var(--muted);}
.start-btn{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:var(--r2);padding:17px;font-family:inherit;font-size:0.95rem;font-weight:800;color:white;cursor:pointer;margin-bottom:12px;box-shadow:0 8px 24px rgba(124,111,255,0.32);transition:all 0.2s;}
.start-btn:active{transform:scale(0.98);}
.tts-full{width:100%;background:var(--surface2);border:1px solid rgba(0,229,176,0.3);border-radius:var(--r);padding:12px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-family:inherit;font-size:0.79rem;font-weight:600;color:var(--accent3);transition:all 0.2s;}

/* STEP */
.step-topbar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:44px 20px 12px;background:rgba(13,13,24,0.95);backdrop-filter:blur(20px);z-index:401;border-bottom:1px solid var(--border);}
.step-topbar-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.step-title-label{font-size:0.8rem;font-weight:700;}
.exit-btn{background:rgba(255,80,80,0.09);border:1px solid rgba(255,80,80,0.22);border-radius:10px;padding:6px 13px;font-family:inherit;font-size:0.7rem;font-weight:700;color:rgba(255,110,110,0.88);cursor:pointer;}
.step-dots{display:flex;gap:5px;}
.step-dot{flex:1;height:3px;border-radius:2px;background:var(--surface2);transition:all 0.3s;}
.step-dot.done{background:var(--accent3);}
.step-dot.active{background:var(--accent);}
.step-body{padding:118px 20px 108px;}
.step-label{display:inline-flex;align-items:center;gap:5px;font-size:0.6rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);background:rgba(124,111,255,0.09);border:1px solid rgba(124,111,255,0.2);border-radius:20px;padding:5px 12px;margin-bottom:14px;}
.step-scene-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:15px 17px;margin-bottom:14px;font-size:0.85rem;line-height:1.8;color:var(--text);}
.step-sentence-big{font-size:1.28rem;font-weight:800;text-align:center;line-height:1.4;margin-bottom:14px;padding:20px;background:linear-gradient(135deg,rgba(124,111,255,0.11),rgba(255,107,157,0.07));border-radius:var(--r2);border:1px solid rgba(124,111,255,0.18);}
.chunk-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px;margin-bottom:9px;}
.chunk-ph{font-size:0.91rem;font-weight:700;color:var(--accent);margin-bottom:5px;}
.chunk-kr{font-size:0.79rem;color:var(--muted);line-height:1.6;}
.pattern-card{background:linear-gradient(135deg,rgba(255,107,157,0.09),rgba(124,111,255,0.06));border:1px solid rgba(255,107,157,0.18);border-radius:var(--r2);padding:15px 17px;margin-bottom:10px;}
.pattern-card-label{font-size:0.6rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:7px;}
.pattern-card-main{font-size:0.98rem;font-weight:700;color:var(--accent2);font-style:italic;margin-bottom:10px;}
.pattern-var{font-size:0.79rem;padding:7px 12px;background:rgba(255,255,255,0.04);border-radius:10px;margin-bottom:5px;color:var(--text);border-left:2px solid rgba(255,107,157,0.38);}
.grammar-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:15px 17px;margin-bottom:10px;}
.narration-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:17px;margin-bottom:14px;}
.narration-body{font-size:0.82rem;line-height:2;color:var(--text);margin-bottom:13px;}
.step-footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 20px 28px;background:rgba(13,13,24,0.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);z-index:401;}
.step-next-btn{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:var(--r2);padding:16px;font-family:inherit;font-size:0.93rem;font-weight:800;color:white;cursor:pointer;box-shadow:0 8px 24px rgba(124,111,255,0.28);transition:all 0.2s;}
.step-next-btn:active{transform:scale(0.98);}
.step-next-btn:disabled{background:var(--surface2);color:var(--muted);box-shadow:none;cursor:default;}

/* QUIZ */
.quiz-type-label{font-size:0.6rem;font-weight:700;letter-spacing:0.1em;color:var(--accent);text-transform:uppercase;margin-bottom:8px;}
.quiz-scene{font-size:0.79rem;color:var(--muted);margin-bottom:13px;line-height:1.6;padding:10px 13px;background:var(--surface2);border-radius:11px;}
.quiz-q{font-size:1.03rem;font-weight:700;line-height:1.5;color:var(--text);margin-bottom:17px;text-align:center;padding:15px;background:var(--surface);border-radius:var(--r2);border:1px solid var(--border);}
.quiz-blank{color:var(--accent);border-bottom:2px solid var(--accent);padding:0 4px;}
.quiz-options{margin-bottom:13px;}
.quiz-opt{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px;margin-bottom:8px;font-family:inherit;font-size:0.85rem;font-weight:500;color:var(--text);cursor:pointer;text-align:left;transition:all 0.2s;}
.quiz-opt.correct{background:rgba(0,229,176,0.11);border-color:var(--accent3);color:var(--accent3);}
.quiz-opt.wrong{background:rgba(255,80,80,0.09);border-color:rgba(255,80,80,0.38);color:rgba(255,110,110,0.88);}
.quiz-opt:active{transform:scale(0.98);}
.quiz-fb{border-radius:var(--r);padding:11px 15px;margin-bottom:13px;font-size:0.8rem;line-height:1.6;display:none;}
.quiz-fb.show{display:block;}
.quiz-fb.correct{background:rgba(0,229,176,0.07);border:1px solid rgba(0,229,176,0.22);color:var(--accent3);}
.quiz-fb.wrong{background:rgba(255,80,80,0.06);border:1px solid rgba(255,80,80,0.22);color:rgba(255,110,110,0.88);}
.quiz-next-btn{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:13px;font-family:inherit;font-size:0.85rem;font-weight:600;color:var(--text);cursor:pointer;display:none;margin-top:4px;}
.quiz-next-btn.show{display:block;}
.qp-dots{display:flex;gap:6px;margin-bottom:15px;}
.qp-dot{flex:1;height:4px;border-radius:2px;background:var(--surface2);}
.qp-dot.done{background:var(--accent3);}
.qp-dot.active{background:var(--accent);}

/* COMPLETE */
.complete-wrap{text-align:center;padding:40px 20px;}
.complete-icon{font-size:4.2rem;margin-bottom:15px;display:block;}
.complete-title{font-size:1.45rem;font-weight:900;margin-bottom:5px;}
.complete-score{font-size:2.8rem;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:10px 0;}
.complete-sub{font-size:0.83rem;color:var(--muted);line-height:1.8;margin-bottom:22px;}

/* STATS */
#stats-view{padding:110px 20px 100px;}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:16px;text-align:center;}
.stat-n{font-size:1.9rem;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:4px;}
.stat-l{font-size:0.68rem;color:var(--muted);}
.prog-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:7px;display:flex;align-items:center;gap:10px;}
.prog-num{font-size:0.7rem;color:var(--muted);flex-shrink:0;width:22px;}
.prog-sentence{flex:1;font-size:0.79rem;color:var(--text);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prog-status{font-size:0.73rem;font-weight:700;}
.prog-status.done{color:var(--accent3);}
.prog-status.pending{color:var(--muted);}

/* TOAST */
.lock-toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(14px);background:rgba(25,25,45,0.96);border:1px solid var(--border);border-radius:var(--r2);padding:13px 20px;font-size:0.8rem;color:var(--text);text-align:center;backdrop-filter:blur(20px);z-index:500;opacity:0;transition:all 0.28s;pointer-events:none;max-width:260px;line-height:1.5;}
.lock-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* XP POPUP */
.xp-popup{position:fixed;top:90px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;border-radius:20px;padding:6px 16px;font-size:0.78rem;font-weight:800;z-index:500;opacity:0;transition:all 0.3s;pointer-events:none;}
.xp-popup.show{opacity:1;}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
.playing{animation:pulse 1s infinite;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeUp 0.32s ease both;}
</style>
</head>
<body>
<div id="app">

<div class="lock-toast" id="lock-toast">🔒 이전 강의를 완료해야<br>열 수 있어요!</div>
<div class="xp-popup" id="xp-popup">+10 XP</div>

<!-- PATH VIEW -->
<div class="view active" id="path-view">
  <div class="top-bar">
    <div class="top-bar-row">
      <div class="logo-text"><span>FLUENCY</span></div>
      <div class="streak-badge">🔥 <span id="streak-num">0</span>일 연속</div>
    </div>
    <div class="xp-bar-wrap">
      <div class="xp-label"><span>레벨 진행도</span><span id="xp-text">0 XP</span></div>
      <div class="xp-bar"><div class="xp-fill" id="xp-fill" style="width:0%"></div></div>
    </div>
  </div>
  <div class="path-container" id="path-container"></div>
</div>

<!-- DETAIL VIEW -->
<div class="fullscreen" id="detail-view">
  <div class="detail-topbar">
    <div class="back-btn" onclick="closeDetail()">←</div>
    <div>
      <div class="detail-info-sub" id="d-sub"></div>
      <div class="detail-info-title" id="d-title"></div>
    </div>
  </div>
  <div class="detail-body" id="d-body"></div>
</div>

<!-- STEP VIEW -->
<div class="fullscreen" id="step-view">
  <div class="step-topbar">
    <div class="step-topbar-row">
      <div class="step-title-label" id="step-label">STEP 1 / 5</div>
      <button class="exit-btn" onclick="exitStep()">✕ 종료</button>
    </div>
    <div class="step-dots" id="step-dots"></div>
  </div>
  <div class="step-body" id="step-body"></div>
  <div class="step-footer">
    <button class="step-next-btn" id="step-next" onclick="nextStep()">다음 →</button>
  </div>
</div>

<!-- STATS VIEW -->
<div class="view" id="stats-view">
  <div class="top-bar">
    <div class="top-bar-row"><div class="logo-text"><span>진도</span></div></div>
  </div>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-n" id="s-done">0</div><div class="stat-l">완료 강의</div></div>
    <div class="stat-card"><div class="stat-n" id="s-streak">0</div><div class="stat-l">연속 학습일</div></div>
    <div class="stat-card"><div class="stat-n" id="s-xp">0</div><div class="stat-l">획득 XP</div></div>
    <div class="stat-card"><div class="stat-n">10</div><div class="stat-l">전체 표현</div></div>
  </div>

<script>
const L=[
  {id:"LECTURE_001",img:"IMG_001",cefr:"A2",s:"I'll let you know when I get there.",ph:"아일 렛 유 노우 웬 아이 겟 데어",mn:"아일(나는 할게) / 렛유노우(알려줄게) / 웬아이겟데어(거기 도착하면)",tts:"아일 렛 유 노우. 웬 아이 겟 데어.",scene:"친구가 걱정하며 도착하면 연락해달라고 했다. 나는 알겠다고 답한다.",emo:"Relief",gr:"will + 동사원형으로 즉흥적 약속 표현. when절은 현재시제 사용.",tb:"격식체 이메일이나 공식 발표에서는 어색함. 가까운 사이 또는 구어체 전용.",pt:"I'll let you know + [시간/조건]",vars:["I'll let you know later.","I'll let you know after the meeting.","I'll let you know as soon as I hear back."],rels:["I'll tell you when I get there.","I'll text you when I arrive."],bq:{q:"I'll ___ you ___ when I get there.",opts:["let / know","tell / about","give / up","show / off"],a:0},sq:{sc:"친구가 늦은 밤 도착하면 연락해달라고 부탁했다.",opts:["I'll let you know when I get there.","I'll call you before I leave.","I'm on my way right now."],a:0},vq:{stem:"I'll let you know ___",acc:["later","tomorrow","after the meeting","as soon as I can"]},nr:"이 문장은 상대방을 안심시킬 때 쓰는 표현입니다. 렛 유 노우는 알려주다라는 뜻입니다. 웬 아이 겟 데어는 도착하면이라는 조건을 나타냅니다. 이 두 덩어리를 합치면 도착하면 알려줄게 라는 자연스러운 약속 표현이 됩니다. 문법을 외우려 하지 말고. 상황과 함께 통째로 익혀두세요.",cen:"Don't memorize it. Feel it, then use it.",ckr:"외우지 마세요. 느끼고. 그냥 쓰세요."},
  {id:"LECTURE_002",img:"IMG_002",cefr:"B1",s:"I'll get back to you as soon as I can.",ph:"아일 겟 백 투 유 애즈 순 애즈 아이 캔",mn:"아일(나는 할게) / 겟백투유(너에게 다시 연락을) / 애즈순애즈아이캔(내가 가능한 한 빨리)",tts:"아일 겟 백 투 유. 애즈 순 애즈 아이 캔.",scene:"업무 회의 중에 동료가 자료를 요청했다. 나는 지금 바쁘지만 나중에 꼭 확인해주겠다고 약속하며 자리로 돌아간다.",emo:"Relief",gr:"will을 사용한 미래 약속과 as soon as 접속사를 활용한 시간 조건절의 결합.",tb:"지키지 못할 약속일 때는 사용하지 않음. 비즈니스 이메일이나 대화에서 매우 빈번하게 사용됨.",pt:"I'll get back to you + [시간/조건]",vars:["I'll get back to you later today.","I'll get back to you by tomorrow morning.","I'll get back to you after checking the files."],rels:["I'll report back to you after the meeting.","I'll reply to you as soon as I can."],bq:{q:"I'll ___ ___ to you as soon as I can.",opts:["get / back","take / off","look / for","come / over"],a:0},sq:{sc:"직장 동료가 질문을 했지만 지금 당장 답을 해줄 수 없는 상황이다.",opts:["I'll get back to you as soon as I can.","I can do it right now.","I don't know the answer."],a:0},vq:{stem:"I'll get back to you ___",acc:["tomorrow","by noon","later","as soon as possible"]},nr:"업무 중에 정말 많이 쓰는 표현입니다. 겟 백 투 유는 상대방에게 다시 연락하겠다는 뜻입니다. 애즈 순 애즈 아이 캔은 내가 가능한 한 빨리라는 의미입니다. 이 문장을 쓰면 상대방에게 신뢰를 줄 수 있습니다. 정중하면서도 확신에 찬 목소리로 연습해 보세요.",cen:"Consistency builds trust. Keep it up.",ckr:"꾸준함이 신뢰를 만듭니다. 계속 힘내세요."},
  {id:"LECTURE_003",img:"IMG_003",cefr:"A2",s:"That's not like you at all.",ph:"댓츠 낫 라이크 유 앳 올",mn:"댓츠낫라이크유(그건 너답지 않아) / 앳올(전혀)",tts:"댓츠 낫 라이크 유. 앳 올.",scene:"친구가 평소와 다르게 약속을 펑크냈다. 나는 걱정과 놀라움으로 그 친구에게 말한다.",emo:"Anxiety",gr:"That is not like + 사람 구조로 상대방의 평소 성격과 다른 행동을 지적할 때 사용.",tb:"비난이 아닌 걱정의 뉘앙스로 사용해야 함. 화난 톤으로 쓰면 공격적으로 들릴 수 있음.",pt:"That's not like + [PERSON] + at all",vars:["That's not like him at all.","That's not like her to be so quiet.","That's not like you to give up so easily."],rels:["You're not yourself today.","This doesn't seem like you."],bq:{q:"That's not ___ you at all.",opts:["like","about","of","with"],a:0},sq:{sc:"평소에 항상 시간을 잘 지키는 친구가 오늘 갑자기 약속에 늦었다.",opts:["That's not like you at all.","You're always late anyway.","I knew you'd be late."],a:0},vq:{stem:"That's not like ___ at all.",acc:["you","him","her","them"]},nr:"이 표현은 상대방이 평소와 다른 행동을 할 때 걱정을 담아 말하는 표현입니다. 낫 라이크 유는 너답지 않다는 뜻입니다. 앳 올을 붙이면 전혀 너답지 않다는 강조가 됩니다. 비난이 아니라 걱정과 관심을 담아서 말하는 표현이에요. 친한 친구에게 자연스럽게 써보세요.",cen:"Sometimes caring sounds like this.",ckr:"때로는 걱정이 이런 말로 나와요."},
  {id:"LECTURE_004",img:"IMG_004",cefr:"B1",s:"I didn't mean to make you feel that way.",ph:"아이 디든트 민 투 메이크 유 필 댓 웨이",mn:"아이디든트민(나는 의도하지 않았어) / 투메이크유필(네가 느끼게 만들려고) / 댓웨이(그런 식으로)",tts:"아이 디든트 민 투. 메이크 유 필 댓 웨이.",scene:"내가 한 말이 친구를 상처 입혔다는 걸 뒤늦게 깨달았다. 나는 진심으로 미안함을 전하며 말한다.",emo:"Regret",gr:"didn't mean to + 동사원형 구조로 의도하지 않은 행동에 대한 사과를 표현.",tb:"변명처럼 들릴 수 있으므로 진심 어린 톤이 반드시 필요함. 가벼운 상황보다 진지한 감정 충돌 후에 사용.",pt:"I didn't mean to + VERB",vars:["I didn't mean to hurt you.","I didn't mean to make you cry.","I didn't mean to say it like that."],rels:["That came out wrong.","I never meant to say that."],bq:{q:"I didn't ___ to make you feel that way.",opts:["mean","want","try","plan"],a:0},sq:{sc:"내가 한 농담이 친구를 상처 입혔다는 걸 뒤늦게 알게 됐다.",opts:["I didn't mean to make you feel that way.","I was just joking, don't be so sensitive.","I said sorry already."],a:0},vq:{stem:"I didn't mean to ___",acc:["hurt you","upset you","offend you","say that"]},nr:"이 표현은 상대방에게 진심으로 사과할 때 쓰는 표현입니다. 디든트 민 투는 그러려고 한 게 아니었다는 뜻입니다. 메이크 유 필 댓 웨이는 그런 식으로 느끼게 만들다라는 의미입니다. 단순한 쏘리보다 훨씬 진심이 담긴 표현이에요. 감정이 상한 상황에서 천천히. 부드럽게 말해보세요.",cen:"A real apology explains, not excuses.",ckr:"진짜 사과는 변명이 아니라 마음을 전하는 거예요."},
  {id:"LECTURE_005",img:"IMG_005",cefr:"B1",s:"It slipped my mind completely.",ph:"잇 슬립트 마이 마인드 컴플리틀리",mn:"잇슬립트마이마인드(머릿속에서 빠져나갔어) / 컴플리틀리(완전히)",tts:"잇 슬립트 마이 마인드. 컴플리틀리.",scene:"친구와 약속을 잡았는데 완전히 잊어버렸다. 친구가 어디 있냐고 연락하자 당황하며 말한다.",emo:"Anxiety",gr:"It slipped my mind는 주어가 It으로 고정된 관용 표현. 과거형으로만 사용하며 자연스럽게 잊혀진 뉘앙스.",tb:"의도적으로 무시하거나 중요한 약속을 잊었을 때 쓰면 가볍게 들려 역효과가 날 수 있음.",pt:"It slipped my mind + ADVERB",vars:["It slipped my mind, sorry.","It completely slipped my mind.","I'm so sorry, it just slipped my mind."],rels:["I totally forgot about it.","It went right out of my head."],bq:{q:"It ___ my mind completely.",opts:["slipped","crossed","changed","left"],a:0},sq:{sc:"친구와 오늘 만나기로 했는데 완전히 잊고 다른 일을 하고 있었다.",opts:["It slipped my mind completely.","I decided not to come.","I thought it was tomorrow."],a:0},vq:{stem:"It slipped my mind ___",acc:["completely","totally","honestly","somehow"]},nr:"이 표현은 무언가를 완전히 잊어버렸을 때 쓰는 표현입니다. 슬립트 마이 마인드는 머릿속에서 빠져나갔다는 뜻입니다. 컴플리틀리를 붙이면 완전히 잊었다는 강조가 됩니다. 아이 포갓보다 훨씬 자연스럽고 원어민스러운 표현이에요. 깜빡했을 때 바로 써보세요.",cen:"It happens. Just say it naturally.",ckr:"누구나 잊어요. 자연스럽게 말하면 돼요."},
  {id:"LECTURE_006",img:"IMG_006",cefr:"A2",s:"I'm not in the mood for that right now.",ph:"아임 낫 인 더 무드 포 댓 라잇 나우",mn:"아임낫인더무드(지금 그럴 기분이 아니야) / 포댓(그것에 대해) / 라잇나우(지금 당장)",tts:"아임 낫 인 더 무드. 포 댓. 라잇 나우.",scene:"친구가 신나게 놀자고 제안했지만 나는 지쳐있거나 기분이 안 좋다. 거절하지만 공격적이지 않게 말한다.",emo:"Tension",gr:"not in the mood for + 명사 또는 동명사 구조. 현재 감정 상태로 부드럽게 거절할 때 사용.",tb:"상대방 제안을 거절할 때 쓰므로 톤이 너무 차갑지 않게 유지해야 함. 격식체 상황에서는 어색함.",pt:"I'm not in the mood for + OBJECT",vars:["I'm not in the mood for pizza tonight.","I'm not in the mood for going out.","I'm not really in the mood for talking right now."],rels:["I'm just not feeling it today.","Maybe some other time."],bq:{q:"I'm not in the ___ for that right now.",opts:["mood","mind","place","feeling"],a:0},sq:{sc:"친구가 오늘 밤 파티에 가자고 했지만 나는 피곤하고 혼자 있고 싶다.",opts:["I'm not in the mood for that right now.","I already have plans tonight.","Sounds great. I'll be there."],a:0},vq:{stem:"I'm not in the mood for ___",acc:["that","going out","talking","it"]},nr:"이 표현은 지금 무언가를 할 기분이 아닐 때 부드럽게 거절하는 표현입니다. 낫 인 더 무드는 그럴 기분이 아니다라는 뜻입니다. 포 댓을 붙이면 그것에 대해 기분이 아니다라는 의미가 됩니다. 라잇 나우를 추가하면 지금 당장은이라는 시간 뉘앙스가 생겨요. 화내지 않고 자연스럽게 거절할 때 써보세요.",cen:"It's okay to say no. Just say it kindly.",ckr:"거절해도 괜찮아요. 부드럽게 말하면 돼요."},
  {id:"LECTURE_007",img:"IMG_007",cefr:"B1",s:"You should have told me sooner.",ph:"유 슈드 해브 톨드 미 수너",mn:"유슈드해브(너는 했어야 했는데) / 톨드미(나한테 말해줬어야) / 수너(더 일찍)",tts:"유 슈드 해브 톨드 미. 수너.",scene:"친구가 중요한 일을 뒤늦게 알려줬다. 이미 늦어버린 상황에서 아쉬움과 섭섭함을 담아 말한다.",emo:"Tension",gr:"should have + 과거분사 구조로 과거에 하지 않은 행동에 대한 아쉬움 또는 가벼운 질책을 표현.",tb:"톤이 강하면 비난처럼 들릴 수 있음. 친한 사이에서 아쉬움을 표현할 때 적합.",pt:"You should have + VERB + me",vars:["You should have told me earlier.","You should have called me sooner.","You should have let me know before."],rels:["Why didn't you tell me sooner?","I wish you had told me earlier."],bq:{q:"You should ___ told me sooner.",opts:["have","would","could","must"],a:0},sq:{sc:"친구가 중요한 시험이 내일이라는 걸 오늘 저녁에 알려줬다.",opts:["You should have told me sooner.","It's okay. I understand.","Why do you always do this?"],a:0},vq:{stem:"You should have told me ___",acc:["sooner","earlier","before","right away"]},nr:"이 표현은 상대방이 중요한 것을 늦게 알려줬을 때 아쉬움을 담아 말하는 표현입니다. 슈드 해브 톨드는 말해줬어야 했는데라는 뜻입니다. 수너를 붙이면 더 일찍이라는 아쉬움이 강조됩니다. 비난보다는 섭섭함의 뉘앙스로 말할 때 자연스러워요. 친한 친구 사이에서 편하게 써보세요.",cen:"It's not too late to be honest next time.",ckr:"다음번엔 더 일찍 말해줘요."},
  {id:"LECTURE_008",img:"IMG_008",cefr:"B1",s:"I can't believe how fast time flies.",ph:"아이 캔트 빌리브 하우 패스트 타임 플라이즈",mn:"아이캔트빌리브(믿기지 않아) / 하우패스트(얼마나 빠른지) / 타임플라이즈(시간이 날아가는지)",tts:"아이 캔트 빌리브. 하우 패스트 타임 플라이즈.",scene:"오랜만에 만난 친구와 이야기하다가 시간이 훌쩍 지나버렸다. 시간의 흐름을 실감하는 순간에 말한다.",emo:"Longing",gr:"I can't believe how + 형용사 + 주어 + 동사 구조로 놀라움을 간접적으로 표현. how절이 명사절로 사용됨.",tb:"격식체 문서나 공식 발표에서는 어색함. 감탄이나 회상의 순간에 자연스럽게 쓰이는 구어 표현.",pt:"I can't believe how + ADJ + time flies",vars:["I can't believe how much you've grown.","I can't believe how quickly it went by.","I can't believe how long it's been."],rels:["Time really flies, doesn't it.","It feels like just yesterday."],bq:{q:"I can't believe how fast time ___.",opts:["flies","runs","moves","passes"],a:0},sq:{sc:"친구와 카페에서 이야기하다 보니 어느새 세 시간이 지나 있었다.",opts:["I can't believe how fast time flies.","We've been here for too long.","Time is going really slowly today."],a:0},vq:{stem:"I can't believe how ___ time flies.",acc:["fast","quickly","insanely fast","incredibly fast"]},nr:"이 표현은 시간이 빠르게 흘렀을 때 감탄하며 쓰는 표현입니다. 캔트 빌리브는 믿기지 않는다는 뜻입니다. 하우 패스트는 얼마나 빠른지라는 의미입니다. 타임 플라이즈는 시간이 날아간다는 영어 관용 표현입니다. 졸업식이나 오랜만의 만남에서 자연스럽게 써보세요.",cen:"Time flies. Make it count.",ckr:"시간은 빠르게 가요. 잘 쓰세요."},

// ══ STATE ══
let S=JSON.parse(localStorage.getItem('fluency_v3')||'{"done":[],"xp":0,"streak":0,"lastStudy":""}');
const EICON={Relief:'😌',Regret:'😔',Anxiety:'😟',Tension:'😤',Longing:'🥹',Joy:'😊',Neutral:'😐'};
function unlocked(i){return i===0||S.done.includes(L[i-1].id);}
function save(){localStorage.setItem('fluency_v3',JSON.stringify(S));}

// ══ XP ══
function addXP(n,label){
  S.xp+=n; save(); updateBars();
  const p=document.getElementById('xp-popup');
  p.textContent=`+${n} XP ${label||''}`;
  p.classList.add('show');
  setTimeout(()=>p.classList.remove('show'),1200);
}
function updateBars(){
  const xp=S.xp%100;
  document.getElementById('xp-fill').style.width=xp+'%';
  document.getElementById('xp-text').textContent=S.xp+' XP 총 획득';
  document.getElementById('streak-num').textContent=S.streak||0;
}

// ══ PATH ══
function renderPath(){
  const c=document.getElementById('path-container');
  let h='';
  L.forEach((l,i)=>{
    const done=S.done.includes(l.id);
    const cur=!done&&unlocked(i);
    const lk=!done&&!cur;
    const cls=done?'done':cur?'current':'locked';
    const icon=done?'✓':cur?(EICON[l.emo]||'📖'):'🔒';
    const num=String(i+1).padStart(3,'0');
    const bubble=cur?`<div class="node-bubble">시작</div>`:'';
    h+=`<div class="path-node-wrap fade-in" style="animation-delay:${i*0.055}s">
      <div class="path-node ${cls}" onclick="nodeClick(${i})">
        <div class="node-icon">${icon}</div>
        <div class="node-num">${num}</div>${bubble}
      </div>
    </div>`;
    if(i<L.length-1){
      const nxt=unlocked(i+1)||S.done.includes(l.id);
      h+=`<div class="path-connector ${nxt?'':'locked'}"></div>`;
    }
    if(i===4){
      const all5=L.slice(0,5).every(x=>S.done.includes(x.id));
      if(all5) h+=`<div class="milestone">🏆 전반전 완주! +50 XP</div>`;
    }
  });
  c.innerHTML=h;
  updateBars();
}

function nodeClick(i){
  if(!unlocked(i)){showToast();return;}
  openDetail(i);
}
function showToast(){
  const t=document.getElementById('lock-toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

// ══ DETAIL ══
let ci=0;
function openDetail(i){
  ci=i; const l=L[i];
  const done=S.done.includes(l.id);
  document.getElementById('d-sub').textContent=`LECTURE ${String(i+1).padStart(3,'0')} · ${l.cefr} · ${EICON[l.emo]||''} ${l.emo}`;
  document.getElementById('d-title').textContent=l.s.length>32?l.s.substring(0,32)+'…':l.s;
  const vH=l.vars.map(v=>`<div class="var-item">• ${v}</div>`).join('');
  const rH=l.rels.map(r=>`<div class="rel-item">→ ${r}</div>`).join('');
  document.getElementById('d-body').innerHTML=`
    <img class="scene-img" src="images/${l.img}.jpg" onerror="this.outerHTML='<div class=\\"scene-img-ph\\">🎬</div>'" alt="">
    <div class="sentence-hero">
      <div class="sentence-hero-text">${l.s}</div>
      <div class="phonetic">${l.ph}</div>
      <div class="meaning">${l.mn}</div>
    </div>
    <div class="tts-row">
      <button class="tts-btn en" onclick="sp('${e(l.s)}','en')">🔊 영어 듣기</button>
      <button class="tts-btn kr" onclick="sp('${e(l.tts)}','ko')">🔊 발음 듣기</button>
    </div>
    <div class="section"><div class="sec-label">상황 & 감정</div><div class="scene-text">${l.scene}</div></div>
    <div class="section"><div class="sec-label">패턴</div><div class="pattern-text">${l.pt}</div>${vH}</div>
    <div class="section"><div class="sec-label">문법 포인트</div><div class="grammar-text">${l.gr}</div><div class="taboo-box">⚠️ ${l.tb}</div></div>
    <div class="section"><div class="sec-label">관련 표현</div>${rH}</div>
    <div class="section">
      <div class="sec-label">강사 나레이션</div>
      <div class="narration-text">${l.nr}</div>
      <button class="tts-full" onclick="sp('${e(l.nr)}','ko')">🎙️ 나레이션 듣기</button>
      <div class="closing-box" style="margin-top:12px;"><div class="closing-en">"${l.cen}"</div><div class="closing-kr">${l.ckr}</div></div>
    </div>
    <button class="start-btn" onclick="startStep(${i})">${done?'🔄 다시 학습하기':'🚀 학습 시작하기'}</button>
  `;
  document.getElementById('detail-view').classList.add('active');
  window.scrollTo(0,0);
}
function closeDetail(){
  document.getElementById('detail-view').classList.remove('active');
  renderPath();
}
function sp(t,lang){
  if(!speechSynthesis)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang=lang==='en'?'en-US':'ko-KR';
  u.rate=lang==='en'?0.85:0.9;
  speechSynthesis.speak(u);
}

// ══ STEP ══
const STEPS=[
  {id:'exposure',name:'첫 노출',icon:'🎬'},
  {id:'meaning', name:'의미 파악',icon:'🔊'},
  {id:'pattern', name:'패턴 인식',icon:'🧩'},
  {id:'emotion', name:'감정 결합',icon:'🎙️'},
  {id:'quiz',    name:'능동 회상',icon:'🎯'},
];
let si=0,qi=0,qs=0,qd=[];

function startStep(i){
  ci=i;si=0;qi=0;qs=0;
  document.getElementById('step-view').classList.add('active');
  renderStep(); window.scrollTo(0,0);
}
function exitStep(){
  if(!confirm('학습을 종료할까요?\n진도는 저장되지 않습니다.'))return;
  document.getElementById('step-view').classList.remove('active');
  window.scrollTo(0,0);
}
function nextStep(){
  si++;
  if(si>=STEPS.length){finalComplete();return;}
  renderStep(); window.scrollTo(0,0);
}
function renderStep(){
  const l=L[ci],s=STEPS[si];
  document.getElementById('step-dots').innerHTML=STEPS.map((_,i)=>`<div class="step-dot ${i<si?'done':i===si?'active':''}"></div>`).join('');
  document.getElementById('step-label').textContent=`${s.icon} ${s.name}  ${si+1}/${STEPS.length}`;
  const btn=document.getElementById('step-next');
  btn.disabled=false; btn.onclick=nextStep;
  btn.textContent=si<STEPS.length-1?'다음 →':'완료 ✓';
  const body=document.getElementById('step-body');
  const img=`<img class="scene-img" src="images/${l.img}.jpg" onerror="this.outerHTML='<div class=\\"scene-img-ph\\">🎬</div>'" alt="">`;

  if(s.id==='exposure'){
    body.innerHTML=`<div class="step-label">🎬 첫 노출 — 상황을 느껴보세요</div>${img}<div class="step-scene-box">${l.scene}</div><div class="step-sentence-big">${l.s}</div>`;
  } else if(s.id==='meaning'){
    btn.disabled=true; btn.textContent='🔊 영어 듣기를 먼저 눌러주세요';
    const chunks=l.mn.split(' / ').map(c=>{const m=c.match(/^(.+?)\((.+?)\)$/);return m?`<div class="chunk-box"><div class="chunk-ph">${m[1]}</div><div class="chunk-kr">${m[2]}</div></div>`:`<div class="chunk-box"><div class="chunk-ph">${c}</div></div>`;}).join('');
    body.innerHTML=`<div class="step-label">🔊 의미 파악 — 소리로 느껴보세요</div><div class="step-sentence-big">${l.s}</div><div class="tts-row" style="margin-bottom:14px;"><button class="tts-btn en" onclick="sSp('${e(l.s)}','en')">🔊 영어 듣기</button><button class="tts-btn kr" onclick="sSp('${e(l.tts)}','ko')">🔊 발음 듣기</button></div>${chunks}`;
  } else if(s.id==='pattern'){
    body.innerHTML=`<div class="step-label">🧩 패턴 인식 — 구조를 파악하세요</div><div class="pattern-card"><div class="pattern-card-label" style="color:var(--accent2);">핵심 패턴</div><div class="pattern-card-main">${l.pt}</div>${l.vars.map(v=>`<div class="pattern-var">• ${v}</div>`).join('')}</div><div class="grammar-card"><div class="pattern-card-label" style="color:var(--accent);">문법 포인트</div><div class="grammar-text" style="margin-bottom:8px;">${l.gr}</div><div class="taboo-box">⚠️ ${l.tb}</div></div>`;
  } else if(s.id==='emotion'){
    btn.disabled=true; btn.textContent='🎙️ 나레이션을 먼저 들어주세요';
    body.innerHTML=`<div class="step-label">🎙️ 감정 결합 — 기억에 새겨보세요</div>${img}<div class="narration-card"><div class="narration-body">${l.nr}</div><button class="tts-full" onclick="sSp('${e(l.nr)}','ko')">🎙️ 나레이션 듣기</button></div><div class="closing-box"><div class="closing-en">"${l.cen}"</div><div class="closing-kr">${l.ckr}</div></div>`;
  } else if(s.id==='quiz'){
    btn.disabled=true; btn.textContent='퀴즈를 완료해주세요';
    qi=0;qs=0;
    qd=[{t:'blank',q:l.bq},{t:'sit',q:l.sq},{t:'var',q:l.vq}];
    renderQ();
  }
}
function sSp(t,lang){
  sp(t,lang);
  setTimeout(()=>{const b=document.getElementById('step-next');if(b.disabled){b.disabled=false;b.textContent=si<STEPS.length-1?'다음 →':'완료 ✓';}},700);
}

// ── QUIZ ──
function renderQ(){
  const body=document.getElementById('step-body');
  if(qi>=qd.length){renderQDone();return;}
  const q=qd[qi];
  const dots=qd.map((_,i)=>`<div class="qp-dot ${i<qi?'done':i===qi?'active':''}"></div>`).join('');
  let h=`<div class="step-label">🎯 능동 회상 — 직접 꺼내보세요</div><div class="qp-dots">${dots}</div>`;
  if(q.t==='blank'){
    const opts=shuffle(q.q.opts);
    const qText=q.q.q.replace(/_+/g,'<span class="quiz-blank">___</span>');
    h+=`<div class="quiz-type-label">🔤 빈칸 채우기</div><div class="quiz-q">${qText}</div><div class="quiz-options">${opts.map(o=>`<button class="quiz-opt" onclick="cB(this,'${e(o)}','${e(q.q.opts[q.q.a])}')">${o}</button>`).join('')}</div>`;
  } else if(q.t==='sit'){
    h+=`<div class="quiz-type-label">🎭 상황 판단</div><div class="quiz-scene">📍 ${q.q.sc}</div><div class="quiz-q">이 상황에서 가장 자연스러운 표현은?</div><div class="quiz-options">${q.q.opts.map((o,i)=>`<button class="quiz-opt" onclick="cS(this,${i},${q.q.a})">${o}</button>`).join('')}</div>`;
  } else {
    h+=`<div class="quiz-type-label">✏️ 변형 완성</div><div class="quiz-q">"${q.q.stem}"<br><small style="color:var(--muted);font-size:0.72rem;">빈칸에 들어갈 표현을 입력하세요</small></div><input id="vi" type="text" placeholder="영어로 입력..." style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;font-family:inherit;font-size:0.9rem;color:var(--text);margin-bottom:12px;outline:none;"><button class="quiz-opt" onclick="cV()" style="text-align:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;border:none;font-weight:700;">확인하기</button>`;
  }
  h+=`<div class="quiz-fb" id="qfb"></div><button class="quiz-next-btn" id="qnb" onclick="qNext()">다음 →</button>`;
  body.innerHTML=h;
}
function cB(btn,sel,correct){
  document.querySelectorAll('.quiz-opt').forEach(b=>b.disabled=true);
  const ok=sel.toLowerCase()===correct.toLowerCase();
  btn.classList.add(ok?'correct':'wrong');
  if(!ok)document.querySelectorAll('.quiz-opt').forEach(b=>{if(b.textContent===correct)b.classList.add('correct');});
  fb(ok,correct);if(ok){qs++;addXP(10,'');}
}
function cS(btn,idx,a){
  document.querySelectorAll('.quiz-opt').forEach(b=>b.disabled=true);
  const ok=idx===a;
  btn.classList.add(ok?'correct':'wrong');
  if(!ok)document.querySelectorAll('.quiz-opt')[a].classList.add('correct');
  fb(ok,qd[qi].q.opts[a]);if(ok){qs++;addXP(10,'');}
}
function cV(){
  const inp=document.getElementById('vi');
  const val=inp.value.trim().toLowerCase();
  const acc=qd[qi].q.acc.map(a=>a.toLowerCase());
  const ok=acc.some(a=>val.includes(a)||a.includes(val));
  inp.style.borderColor=ok?'var(--accent3)':'rgba(255,80,80,0.5)';
  document.querySelector('[onclick="cV()"]').style.display='none';
  fb(ok,qd[qi].q.acc[0]);if(ok){qs++;addXP(10,'');}
}
function fb(ok,correct){
  const el=document.getElementById('qfb');
  el.className=`quiz-fb show ${ok?'correct':'wrong'}`;
  el.innerHTML=ok?`✅ 정확해요! <b>${correct}</b>`:`❌ 정답: <b>${correct}</b>`;
  document.getElementById('qnb').classList.add('show');
}
function qNext(){qi++;renderQ();window.scrollTo(0,0);}

function renderQDone(){
  const pct=Math.round((qs/qd.length)*100);
  const pass=pct>=67;
  document.getElementById('step-body').innerHTML=`
    <div class="complete-wrap fade-in">
      <span class="complete-icon">${pct===100?'🎉':pass?'👍':'💪'}</span>
      <div class="complete-title">${pct===100?'완벽해요!':pass?'잘했어요!':'다시 도전!'}</div>
      <div class="complete-score">${qs}/${qd.length}</div>
      <div style="font-size:0.8rem;color:var(--muted);">+${qs*10} XP 획득</div>
    </div>`;
  const btn=document.getElementById('step-next');
  btn.disabled=false;
  if(pass){btn.textContent='습득 완료 ✓';}
  else{
    btn.textContent='🔄 퀴즈 다시 풀기';
    btn.onclick=()=>{qi=0;qs=0;renderQ();window.scrollTo(0,0);btn.onclick=nextStep;};
  }
}

function finalComplete(){
  const l=L[ci];
  if(!S.done.includes(l.id)){
    S.done.push(l.id);
    const today=new Date().toDateString();
    const yest=new Date(Date.now()-86400000).toDateString();
    if(S.lastStudy!==today){S.streak=S.lastStudy===yest?(S.streak||0)+1:1;S.lastStudy=today;}
    if(S.done.length===5)addXP(50,'🏆 절반 완주 보너스');
    if(S.done.length===10)addXP(100,'🎓 전체 완주 보너스');
    save();
  }
  document.getElementById('step-body').innerHTML=`
    <div class="complete-wrap fade-in">
      <span class="complete-icon">🎓</span>
      <div class="complete-title">습득 완료!</div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:16px;margin:14px 0;">
        <div style="font-size:0.68rem;color:var(--muted);margin-bottom:5px;">오늘 습득한 표현</div>
        <div style="font-size:0.98rem;font-weight:700;color:var(--accent2);">${l.s}</div>
      </div>
      <div class="complete-sub">${l.ckr}<br><i style="color:var(--accent);">"${l.cen}"</i></div>
      ${S.done.length<L.length?`<div style="font-size:0.8rem;color:var(--accent3);margin-bottom:16px;">🔓 다음 표현이 열렸어요!</div>`:'<div style="font-size:0.8rem;color:var(--gold);margin-bottom:16px;">🏆 모든 표현을 습득했어요!</div>'}
    </div>`;
  const btn=document.getElementById('step-next');
  btn.disabled=false; btn.textContent='← 목록으로';
  btn.onclick=()=>{
    document.getElementById('step-view').classList.remove('active');
    document.getElementById('detail-view').classList.remove('active');
    renderPath(); btn.onclick=nextStep; window.scrollTo(0,0);
  };
}

// ══ NAV ══
function showNav(v){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+v).classList.add('active');
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  if(v==='path')document.getElementById('path-view').classList.add('active');
  else if(v==='stats'){document.getElementById('stats-view').classList.add('active');renderStats();}
  window.scrollTo(0,0);
}
function renderStats(){
  document.getElementById('s-done').textContent=S.done.length;
  document.getElementById('s-streak').textContent=S.streak||0;
  document.getElementById('s-xp').textContent=S.xp||0;
  document.getElementById('prog-list').innerHTML=L.map((l,i)=>{
    const done=S.done.includes(l.id);
    const ul=unlocked(i);
    return `<div class="prog-row"><span class="prog-num">${String(i+1).padStart(2,'0')}</span><span class="prog-sentence">${l.s}</span><span class="prog-status ${done?'done':'pending'}">${done?'✅':ul?'🔓':'🔒'}</span></div>`;
  }).join('');
}

// ══ UTIL ══
function shuffle(a){return[...a].sort(()=>Math.random()-0.5);}
function e(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');}

renderPath();
</script>
</body>
</html>
