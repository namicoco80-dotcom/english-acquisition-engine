<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6c3fff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FLUENCY</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ── */
:root {
  --bg: #f7f4ff;
  --white: #ffffff;
  --surf: #ede8ff;
  --acc: #6c3fff;
  --acc2: #ff3d7f;
  --acc3: #00c49a;
  --gold: #f5a623;
  --err: #ff3d5f;
  --txt: #1a0f40;
  --mut: #8878b0;
  --bdr: rgba(108,63,255,0.14);
  --sh: 0 4px 20px rgba(108,63,255,0.10);
  --sh2: 0 8px 32px rgba(108,63,255,0.18);
  --r: 18px; --r2: 26px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:'Sora','Noto Sans KR',sans-serif; background:var(--bg); color:var(--txt); min-height:100vh; overflow-x:hidden; }
#app { max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }

/* ── LAYER SYSTEM ── */
/* 각 뷰는 display:none / display:flex로 토글 */
.layer { display:none; flex-direction:column; min-height:100vh; }
.layer.active { display:flex; }

/* ── PATH LAYER ── */
#layer-path { background:var(--bg); }
.path-topbar {
  padding: 50px 20px 14px;
  background: rgba(247,244,255,0.97);
  border-bottom: 2px solid var(--bdr);
  box-shadow: 0 2px 16px rgba(108,63,255,0.07);
  position: sticky; top:0; z-index:10;
}
.path-tb-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.logo { font-size:1.4rem; font-weight:900; letter-spacing:-0.05em; background:linear-gradient(135deg,#6c3fff,#ff3d7f); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.streak { display:flex; align-items:center; gap:5px; background:rgba(245,166,35,0.12); border:2px solid rgba(245,166,35,0.3); border-radius:20px; padding:5px 12px; font-size:0.72rem; font-weight:800; color:#c47a00; }
.xp-row { display:flex; align-items:center; gap:10px; }
.lv-chip { background:linear-gradient(135deg,var(--acc),var(--acc2)); color:white; border-radius:12px; padding:3px 10px; font-size:0.62rem; font-weight:800; white-space:nowrap; }
.xp-bar-wrap { flex:1; }
.xp-bar { height:8px; background:var(--surf); border-radius:4px; overflow:hidden; border:1px solid var(--bdr); }
.xp-fill { height:100%; background:linear-gradient(90deg,var(--acc),var(--acc2)); border-radius:4px; transition:width 0.6s; }
.xp-txt { font-size:0.6rem; font-weight:700; color:var(--mut); white-space:nowrap; }
.path-body { flex:1; overflow-y:auto; padding:16px 30px 100px; }
.path-connector { width:4px; height:38px; margin:0 auto; border-radius:2px; }
.path-connector.on { background:linear-gradient(180deg,var(--acc3),rgba(0,196,154,0.15)); }
.path-connector.off { background:linear-gradient(180deg,#d0c8f0,rgba(208,200,240,0.15)); }
.node-wrap { display:flex; justify-content:center; }
.node-wrap:nth-child(4n+1) .node { margin-left:0; }
.node-wrap:nth-child(4n+3) .node { margin-left:-88px; }
.node-wrap:nth-child(4n+5) .node { margin-left:0; }
.node-wrap:nth-child(4n+7) .node { margin-left:88px; }
.node { position:relative; width:80px; height:80px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition:transform 0.15s; flex-shrink:0; }
.node:active { transform:scale(0.88)!important; }
.node.done { background:linear-gradient(145deg,#00e5b0,#00b880); box-shadow:0 6px 22px rgba(0,229,176,0.38),0 0 0 5px rgba(0,229,176,0.14); }
.node.cur { background:linear-gradient(145deg,var(--acc),var(--acc2)); box-shadow:0 8px 26px rgba(108,63,255,0.48),0 0 0 6px rgba(108,63,255,0.18); animation:glow 2s infinite; }
.node.lk { background:linear-gradient(145deg,#d0c8f0,#c0b8e0); cursor:default; }
.node.lk:active { transform:none!important; }
@keyframes glow { 0%,100%{box-shadow:0 8px 26px rgba(108,63,255,0.48),0 0 0 6px rgba(108,63,255,0.18);}50%{box-shadow:0 8px 26px rgba(108,63,255,0.68),0 0 0 10px rgba(108,63,255,0.1);} }
.node-ico { font-size:1.65rem; line-height:1; }
.node-num { font-size:0.58rem; font-weight:800; margin-top:2px; color:rgba(255,255,255,0.82); }
.node.lk .node-num { color:rgba(80,60,140,0.55); }
.node-bubble { position:absolute; background:var(--acc); color:white; border-radius:13px; padding:6px 13px; font-size:0.75rem; font-weight:800; white-space:nowrap; box-shadow:0 4px 14px rgba(108,63,255,0.32); bottom:calc(100% + 10px); left:50%; transform:translateX(-50%); pointer-events:none; }
.node-bubble::after { content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%); border:7px solid transparent; border-top-color:var(--acc); border-bottom:0; }
.milestone { display:flex; align-items:center; justify-content:center; gap:8px; background:linear-gradient(135deg,rgba(245,166,35,0.12),rgba(255,61,127,0.06)); border:2px solid rgba(245,166,35,0.28); border-radius:var(--r2); padding:13px 18px; margin:14px 0; font-size:0.8rem; font-weight:800; color:#c47a00; }
.path-bnav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:rgba(247,244,255,0.97); backdrop-filter:blur(20px); border-top:2px solid var(--bdr); display:grid; grid-template-columns:repeat(3,1fr); padding:8px 16px 22px; gap:4px; z-index:20; }
.nb { background:none; border:none; font-family:inherit; font-size:0.62rem; font-weight:800; color:#a090c8; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px; border-radius:14px; }
.nb-ico { font-size:1.25rem; }
.nb.on { color:var(--acc); }

/* ── LESSON LAYER (State Machine) ── */
#layer-lesson { background:var(--bg); position:fixed; top:0; left:0; width:100%; height:100%; max-width:480px; left:50%; transform:translateX(-50%); z-index:100; overflow:hidden; flex-direction:column; }

/* LESSON HEADER */
.lesson-header {
  padding: 48px 16px 12px;
  background: rgba(247,244,255,0.97);
  border-bottom: 2px solid var(--bdr);
  flex-shrink: 0;
}
.lh-row { display:flex; align-items:center; gap:10px; }
.lh-close { width:38px; height:38px; border-radius:13px; background:var(--surf); border:2px solid var(--bdr); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:1rem; color:var(--mut); font-weight:700; flex-shrink:0; }
.lh-progress { flex:1; }
.lh-bar { height:8px; background:var(--surf); border-radius:4px; overflow:hidden; border:1px solid var(--bdr); }
.lh-fill { height:100%; background:linear-gradient(90deg,var(--acc),var(--acc2)); border-radius:4px; transition:width 0.4s; }
.lh-counter { font-size:0.65rem; font-weight:800; color:var(--mut); text-align:right; margin-top:4px; }

/* STAGE CONTAINER — 핵심 */
.stage-container {
  flex: 1;
  overflow-y: auto;
  padding: 20px 20px 110px;
  -webkit-overflow-scrolling: touch;
}
.stage-container::-webkit-scrollbar { display:none; }

/* STAGE 공통 fade-in */
.stage-wrap { animation:fadeUp 0.3s ease both; }
@keyframes fadeUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }

/* STAGE 타입별 헤더 */
.stage-badge {
  display:inline-flex; align-items:center; gap:6px;
  font-size:0.62rem; font-weight:800; letter-spacing:0.12em; text-transform:uppercase;
  border-radius:20px; padding:5px 14px; margin-bottom:14px;
  border:2px solid;
}
.stage-badge.purple { color:var(--acc); background:rgba(108,63,255,0.08); border-color:rgba(108,63,255,0.2); }
.stage-badge.pink { color:var(--acc2); background:rgba(255,61,127,0.07); border-color:rgba(255,61,127,0.2); }
.stage-badge.green { color:var(--acc3); background:rgba(0,196,154,0.07); border-color:rgba(0,196,154,0.2); }
.stage-badge.gold { color:var(--gold); background:rgba(245,166,35,0.08); border-color:rgba(245,166,35,0.22); }

/* 공통 카드 */
.card { background:var(--white); border:2px solid var(--bdr); border-radius:var(--r2); padding:18px 20px; margin-bottom:14px; box-shadow:var(--sh); }
.card.accent { background:linear-gradient(135deg,rgba(108,63,255,0.07),rgba(255,61,127,0.04)); border-color:rgba(108,63,255,0.18); }
.card.hero { padding:24px; text-align:center; }

/* 문장 히어로 */
.sentence-hero { font-size:1.4rem; font-weight:900; line-height:1.45; color:var(--txt); margin-bottom:10px; }
.sentence-sub { font-size:0.85rem; color:var(--mut); line-height:1.7; }

/* 대화 */
.dlg-speaker { font-size:0.6rem; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; color:var(--mut); margin-bottom:3px; }
.dlg-line { font-size:1rem; font-weight:600; color:var(--txt); line-height:1.55; }
.dlg-divider { border:none; border-top:1px solid var(--bdr); margin:12px 0; }
.dlg-tts { margin-top:8px; display:inline-flex; align-items:center; gap:5px; background:var(--surf); border:1.5px solid var(--bdr); border-radius:10px; padding:5px 12px; cursor:pointer; font-family:inherit; font-size:0.75rem; font-weight:700; color:var(--acc); }

/* 선택지 */
.opts { display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
.opt {
  background:var(--white); border:2px solid var(--bdr); border-radius:var(--r);
  padding:16px 18px; font-family:inherit; font-size:0.92rem; font-weight:600;
  color:var(--txt); cursor:pointer; text-align:left; transition:all 0.18s;
  box-shadow:0 2px 8px rgba(0,0,0,0.04);
}
.opt:active { transform:scale(0.98); }
.opt.ok { background:rgba(0,196,154,0.1); border-color:var(--acc3); color:#006b54; }
.opt.no { background:rgba(255,61,127,0.08); border-color:rgba(255,61,127,0.4); color:#a01040; }
.opt.sel { background:rgba(108,63,255,0.08); border-color:var(--acc); color:var(--acc); }

/* 피드백 */
.fb {
  border-radius:var(--r); padding:14px 18px; font-size:0.88rem; font-weight:600;
  line-height:1.6; margin-bottom:14px; display:none;
}
.fb.show { display:block; }
.fb.ok { background:rgba(0,196,154,0.09); border:2px solid rgba(0,196,154,0.28); color:#006b54; }
.fb.no { background:rgba(255,61,127,0.07); border:2px solid rgba(255,61,127,0.22); color:#a01040; }

/* 청크 */
.chunks-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
.chunk-tag {
  background:var(--surf); border:2px solid var(--bdr); border-radius:var(--r);
  padding:10px 16px; font-size:0.9rem; font-weight:700; color:var(--txt);
  cursor:pointer; transition:all 0.2s;
}
.chunk-tag.revealed { background:var(--acc); border-color:var(--acc); color:white; box-shadow:0 4px 14px rgba(108,63,255,0.3); }
.chunk-meaning { background:var(--white); border:2px solid var(--bdr); border-radius:var(--r); padding:14px 18px; font-size:0.9rem; color:var(--txt); line-height:1.6; margin-bottom:10px; display:none; box-shadow:var(--sh); }
.chunk-meaning.show { display:block; animation:fadeUp 0.2s ease; }

/* 패턴 */
.pattern-hero { background:linear-gradient(135deg,var(--acc),var(--acc2)); border-radius:var(--r2); padding:22px; text-align:center; margin-bottom:14px; box-shadow:0 8px 24px rgba(108,63,255,0.3); }
.pattern-str { font-size:1.25rem; font-weight:900; color:white; font-style:italic; margin-bottom:8px; }
.pattern-exp { font-size:0.82rem; color:rgba(255,255,255,0.75); line-height:1.6; }
.slot-box { background:var(--white); border:2px solid var(--bdr); border-radius:var(--r2); padding:16px 18px; margin-bottom:10px; box-shadow:var(--sh); }
.slot-label { font-size:0.6rem; font-weight:800; letter-spacing:0.1em; color:var(--acc); text-transform:uppercase; margin-bottom:10px; }
.slot-chips { display:flex; flex-wrap:wrap; gap:8px; }
.slot-chip { background:var(--surf); border:2px solid rgba(108,63,255,0.18); border-radius:20px; padding:6px 14px; font-size:0.82rem; font-weight:700; color:var(--acc); cursor:pointer; transition:all 0.2s; }
.slot-chip:active { background:var(--acc); color:white; }

/* 변형 슬라이드 */
.var-slide { background:var(--white); border:2px solid var(--bdr); border-radius:var(--r2); padding:20px; margin-bottom:12px; box-shadow:var(--sh); opacity:0; transform:translateY(14px); transition:all 0.35s; }
.var-slide.show { opacity:1; transform:translateY(0); }
.var-txt { font-size:1rem; font-weight:600; color:var(--txt); line-height:1.6; margin-bottom:10px; }
.var-tts { display:inline-flex; align-items:center; gap:5px; background:var(--surf); border:1.5px solid var(--bdr); border-radius:10px; padding:5px 12px; cursor:pointer; font-family:inherit; font-size:0.75rem; font-weight:700; color:var(--acc); }

/* 유도 출력 */
.guided-sentence { font-size:1.1rem; font-weight:800; color:var(--txt); line-height:1.6; text-align:center; padding:20px; background:var(--white); border:2px solid rgba(108,63,255,0.18); border-radius:var(--r2); margin-bottom:16px; box-shadow:var(--sh2); }
.blank-slot { color:var(--acc); border-bottom:3px solid var(--acc); padding:0 6px; display:inline-block; min-width:60px; }

/* 자유 출력 */
.free-inp { width:100%; background:var(--white); border:2px solid var(--bdr); border-radius:var(--r); padding:16px; font-family:inherit; font-size:0.95rem; color:var(--txt); outline:none; resize:none; line-height:1.7; min-height:70px; }
.free-inp:focus { border-color:var(--acc); }

/* 감정 카드 */
.emotion-card { background:linear-gradient(135deg,rgba(255,61,127,0.07),rgba(108,63,255,0.05)); border:2px solid rgba(255,61,127,0.18); border-radius:var(--r2); padding:18px; margin-bottom:12px; }
.emotion-label { font-size:0.6rem; font-weight:800; letter-spacing:0.1em; color:var(--acc2); text-transform:uppercase; margin-bottom:10px; }
.emotion-anchor { background:linear-gradient(135deg,rgba(108,63,255,0.07),rgba(255,61,127,0.04)); border:2px solid rgba(108,63,255,0.15); border-radius:var(--r2); padding:16px; text-align:center; font-size:0.92rem; font-weight:700; color:var(--txt); margin-bottom:12px; }

/* 기억 카드 */
.memory-schedule { background:var(--white); border:2px solid var(--bdr); border-radius:var(--r2); padding:18px; margin-bottom:14px; box-shadow:var(--sh); }
.mem-row { display:flex; align-items:center; gap:14px; padding:10px 0; border-bottom:1px solid var(--bdr); }
.mem-row:last-child { border-bottom:none; }
.mem-day { width:56px; font-size:0.72rem; font-weight:800; color:var(--acc); flex-shrink:0; }
.mem-action { font-size:0.86rem; color:var(--txt); font-weight:500; }
.recall-card { background:linear-gradient(135deg,var(--acc),var(--acc2)); border-radius:var(--r2); padding:20px; text-align:center; margin-bottom:12px; box-shadow:0 8px 24px rgba(108,63,255,0.28); }
.recall-lbl { font-size:0.62rem; font-weight:800; letter-spacing:0.1em; color:rgba(255,255,255,0.65); text-transform:uppercase; margin-bottom:8px; }
.recall-txt { font-size:0.95rem; font-weight:800; color:white; line-height:1.6; }

/* 완료 */
.complete-screen { text-align:center; padding:30px 0; }
.cmp-ico { font-size:5rem; margin-bottom:14px; display:block; }
.cmp-title { font-size:1.55rem; font-weight:900; margin-bottom:6px; }
.cmp-score { font-size:2.8rem; font-weight:900; background:linear-gradient(135deg,var(--acc),var(--acc2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin:10px 0; }
.stars { display:flex; justify-content:center; gap:10px; margin:12px 0; }
.star { font-size:2.5rem; filter:grayscale(1); opacity:0.25; transition:all 0.4s; }
.star.lit { filter:none; opacity:1; animation:starPop 0.4s ease; }
@keyframes starPop { 0%{transform:scale(0.5)} 60%{transform:scale(1.3)} 100%{transform:scale(1)} }

/* LESSON FOOTER — CTA */
.lesson-footer {
  position:absolute; bottom:0; left:0; right:0;
  padding:12px 20px 28px;
  background:rgba(247,244,255,0.97);
  backdrop-filter:blur(20px);
  border-top:2px solid var(--bdr);
}
.cta {
  width:100%; border:none; border-radius:var(--r2); padding:17px;
  font-family:inherit; font-size:1rem; font-weight:900; color:white;
  cursor:pointer; transition:all 0.18s;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  box-shadow:0 8px 26px rgba(108,63,255,0.3);
}
.cta:active { transform:scale(0.98); }
.cta:disabled { background:#d0c8f0; box-shadow:none; cursor:default; color:rgba(255,255,255,0.5); }
.cta.ghost { background:var(--surf); color:var(--acc); box-shadow:none; border:2px solid var(--bdr); }

/* ── STATS LAYER ── */
#layer-stats { background:var(--bg); overflow-y:auto; }
.stats-topbar { padding:50px 20px 14px; background:rgba(247,244,255,0.97); border-bottom:2px solid var(--bdr); position:sticky; top:0; }
.stats-body { padding:20px 20px 100px; }
.sg { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:20px; }
.sc { background:var(--white); border:2px solid var(--bdr); border-radius:var(--r2); padding:18px; text-align:center; box-shadow:var(--sh); }
.sn { font-size:2rem; font-weight:900; background:linear-gradient(135deg,var(--acc),var(--acc2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; line-height:1; margin-bottom:4px; }
.sl { font-size:0.68rem; color:var(--mut); font-weight:700; }
.badges { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px; }
.badge { background:var(--white); border:2px solid var(--bdr); border-radius:var(--r); padding:13px 6px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,0.04); }
.badge.on { border-color:rgba(245,166,35,0.38); background:rgba(245,166,35,0.04); }
.badge-ico { font-size:1.75rem; margin-bottom:5px; filter:grayscale(1); opacity:0.2; }
.badge.on .badge-ico { filter:none; opacity:1; }
.badge-nm { font-size:0.57rem; color:var(--mut); font-weight:700; }
.badge.on .badge-nm { color:#c47a00; }
.sec-lbl { font-size:0.7rem; font-weight:800; color:var(--mut); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:12px; }
.pr { background:var(--white); border:2px solid var(--bdr); border-radius:var(--r); padding:13px 15px; margin-bottom:8px; display:flex; align-items:center; gap:12px; box-shadow:0 2px 8px rgba(0,0,0,0.04); }
.pn { font-size:0.68rem; color:var(--mut); flex-shrink:0; width:22px; font-weight:700; }
.ps { flex:1; font-size:0.8rem; font-weight:600; color:var(--txt); min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pst { font-size:0.75rem; font-weight:800; }
.pst.done { color:var(--acc3); }
.pst.pend { color:var(--mut); }

/* ── LOADING OVERLAY ── */
#loading { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); z-index:200; display:none; align-items:center; justify-content:center; flex-direction:column; gap:16px; }
#loading.show { display:flex; }
.ld-ico { font-size:3rem; animation:spin 1.5s linear infinite; }
@keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
.ld-txt { font-size:0.88rem; font-weight:700; color:var(--mut); }

/* ── OVERLAYS ── */
.toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(14px); background:var(--txt); color:white; border-radius:var(--r2); padding:13px 22px; font-size:0.82rem; text-align:center; z-index:500; opacity:0; transition:all 0.28s; pointer-events:none; max-width:260px; line-height:1.6; box-shadow:0 8px 24px rgba(0,0,0,0.2); }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.xp-pop { position:fixed; top:90px; left:50%; transform:translateX(-50%); background:linear-gradient(135deg,var(--acc),var(--acc2)); color:white; border-radius:20px; padding:7px 18px; font-size:0.82rem; font-weight:800; z-index:500; opacity:0; transition:all 0.3s; pointer-events:none; box-shadow:0 4px 16px rgba(108,63,255,0.3); }
.xp-pop.show { opacity:1; }

const LEVELS = [

];
const EICON = {Relief:'😌',Regret:'😔',Anxiety:'😟',Tension:'😤',Longing:'🥹',Joy:'😊',Neutral:'😐'};

const BADGES = [

const EICO = {Relief:'😌',Regret:'😔',Anxiety:'😟',Tension:'😤',Longing:'🥹',Joy:'😊',Neutral:'😐'};

// ════════════════════════════════════════════
// ACQUISITION ENGINE v2
// ════════════════════════════════════════════

// ── 1. Pattern Index (확장성 핵심) ──────────
// 전체 탐색 금지. 패턴 → 문장 ID 역색인
const PATTERN_INDEX = (function() {
  const idx = {};
  LECTURES.forEach(l => {
    (l.patterns || []).forEach(p => {
      if (!idx[p]) idx[p] = [];
      idx[p].push(l.id);
    });
  });
  return idx;
})();

// ── 2. User Memory Model ─────────────────────
function getDefaultUserModel() {
  return {
    pattern_mastery:  {},   // {pattern_id: 0.0~1.0}
    memory_strength:  {},   // {sentence_id: 0.0~1.0}
    hesitation_score: {},   // {pattern_id: 0.0~1.0}
    error_history:    {},   // {pattern_id: count}
    last_review_time: {},   // {sentence_id: ISO string}
    emotion_weight:   {},   // {sentence_id: 0.0~1.0} — 감정 강도 가중치
    total_sessions:   0,
    total_correct:    0,
    total_attempts:   0
  };
}
function loadUserModel() {
  try {
    const s = localStorage.getItem('fluency_user_model_v2');
    return s ? JSON.parse(s) : getDefaultUserModel();
  } catch(e) { return getDefaultUserModel(); }
}
function saveUserModel(m) {
  localStorage.setItem('fluency_user_model_v2', JSON.stringify(m));
}

// ── 3. Forgetting Curve (시간 기반 감쇠) ─────
const DECAY_PARAMS = {
  weak:   0.7,   // 하루 30% 감쇠
  medium: 0.85,  // 하루 15% 감쇠
  strong: 0.95   // 하루 5% 감쇠
};
function applyDecay(strength, hoursSince) {
  const days = hoursSince / 24;
  const level = strength >= 0.7 ? 'strong' : strength >= 0.4 ? 'medium' : 'weak';
  const rate = DECAY_PARAMS[level];
  return strength * Math.pow(rate, days);
}
function getDecayedStrength(sentenceId, userModel) {
  const raw = userModel.memory_strength[sentenceId] || 0;
  const lastTime = userModel.last_review_time[sentenceId];
  if (!lastTime) return raw;
  const hours = (Date.now() - new Date(lastTime).getTime()) / 3600000;
  return applyDecay(raw, hours);
}

// ── 4. Memory Update (시간 + 감정 포함) ──────
function updateMemory(userModel, sentence, result) {
  const patterns = sentence.patterns || [];
  const speedBonus = result.responseTime < 3 ? 0.10
                   : result.responseTime < 6 ? 0.06 : 0.03;

  patterns.forEach(p => {
    if (userModel.pattern_mastery[p]  === undefined) userModel.pattern_mastery[p]  = 0;
    if (userModel.error_history[p]    === undefined) userModel.error_history[p]    = 0;
    if (userModel.hesitation_score[p] === undefined) userModel.hesitation_score[p] = 0;

    if (result.correct) {
      userModel.pattern_mastery[p] = Math.min(1, userModel.pattern_mastery[p] + speedBonus);
      if (result.responseTime > 6)
        userModel.hesitation_score[p] = Math.min(1, userModel.hesitation_score[p] + 0.1);
    } else {
      userModel.pattern_mastery[p] = Math.max(0, userModel.pattern_mastery[p] - 0.04);
      userModel.error_history[p]++;
      userModel.hesitation_score[p] = Math.min(1, userModel.hesitation_score[p] + 0.2);
    }
    userModel.pattern_mastery[p] = Math.max(0, Math.min(1, userModel.pattern_mastery[p]));
  });

  // memory_strength: decay 적용 후 업데이트
  const decayed = getDecayedStrength(sentence.id, userModel);
  const emotionBoost = userModel.emotion_weight[sentence.id] || 0;
  const delta = result.correct
    ? 0.12 + emotionBoost * 0.05   // 감정 강한 문장 → 더 많이 강화
    : -0.06;
  userModel.memory_strength[sentence.id] = Math.max(0, Math.min(1, decayed + delta));
  userModel.last_review_time[sentence.id] = new Date().toISOString();

  userModel.total_attempts++;
  if (result.correct) userModel.total_correct++;

  saveUserModel(userModel);
  return userModel;
}

// ── 5. 감정 가중치 기록 ─────────────────────
function recordEmotionWeight(sentenceId, emotionTag, userModel) {
  const HIGH_EMOTION = ['Regret','Anxiety','Tension','Longing'];
  const weight = HIGH_EMOTION.includes(emotionTag) ? 0.8 : 0.3;
  userModel.emotion_weight[sentenceId] = weight;
}

// ── 6. Priority Calculation (강화됨) ─────────
function calculatePriority(sentence, userModel) {
  const patterns = sentence.patterns || [];
  let masteryScore = 0, errorScore = 0, hesitScore = 0;

  patterns.forEach(p => {
    masteryScore += (1 - (userModel.pattern_mastery[p] || 0));
    errorScore   += (userModel.error_history[p] || 0) * 0.5;
    hesitScore   += (userModel.hesitation_score[p] || 0) * 0.8;
  });
  const pLen = Math.max(1, patterns.length);

  // recency: 마지막 복습으로부터 경과 시간
  const lastTime = userModel.last_review_time[sentence.id];
  const hoursSince = lastTime
    ? (Date.now() - new Date(lastTime).getTime()) / 3600000
    : 999; // 한 번도 안 한 건 최대 우선
  const recencyScore = Math.min(1, hoursSince / 48); // 48시간 기준 정규화

  // 감정 가중치
  const emotionBoost = (userModel.emotion_weight[sentence.id] || 0) * 0.15;

  // variety: 약간의 랜덤성 (지루함 방지)
  const randomScore = Math.random() * 0.1;

  const priority =
    (masteryScore / pLen) * 0.40 +
    (errorScore   / pLen) * 0.20 +
    recencyScore           * 0.30 +
    randomScore            * 0.10 +
    emotionBoost;

  // 이미 완료된 건 낮추되 배제 X (복습 필요)
  return S.done.includes(sentence.id) ? priority * 0.45 : priority;
}

// ── 7. Sentence Selection Engine (인덱스 기반) ──
function selectNextSentence(userModel) {
  // 1. 가장 mastery 낮은 패턴 top3 추출
  const weakPatterns = Object.entries(userModel.pattern_mastery)
    .sort(([,a],[,b]) => a - b)
    .slice(0, 3)
    .map(([p]) => p);

  // 아직 mastery 기록 없는 패턴도 포함
  const allPatterns = [...new Set([
    ...weakPatterns,
    ...LECTURES.flatMap(l => l.patterns || []).filter(p => !userModel.pattern_mastery[p])
  ])].slice(0, 5);

  // 2. 해당 패턴 인덱스에서 후보 문장만 조회 (전체 탐색 X)
  const candidateIds = new Set();
  allPatterns.forEach(p => {
    (PATTERN_INDEX[p] || []).forEach(id => candidateIds.add(id));
  });

  // 후보가 없으면 전체 fallback
  const candidates = candidateIds.size > 0
    ? LECTURES.filter(l => candidateIds.has(l.id))
    : LECTURES;

  // 3. 후보 중 우선순위 계산
  return candidates.sort((a,b) =>
    calculatePriority(b, userModel) - calculatePriority(a, userModel)
  )[0] || LECTURES[0];
}

// ── 8. Pattern Graph 다음 추천 ───────────────
function getNextRecommendedPatterns(userModel) {
  const sorted = Object.entries(userModel.pattern_mastery)
    .sort(([,a],[,b]) => a - b).slice(0, 3);
  const recommended = new Set();
  sorted.forEach(([p]) => {
    const node = PATTERN_GRAPH[p];
    if (node) node.next.forEach(n => recommended.add(n));
  });
  return [...recommended].slice(0, 3);
}

// ── 11. Free Output 의미 기반 평가 ───────────
function evaluateFreeOutput(input, sentence, modelAnswer) {
  const inp = input.toLowerCase().trim();
  const model = (modelAnswer || sentence.s).toLowerCase();

  // 기준 1: 패턴 핵심 단어 포함 여부
  const keyWords = (sentence.patterns || []).flatMap(p =>
    p.split('_').filter(w => w.length > 2)
  );
  const keyMatch = keyWords.filter(w => inp.includes(w)).length;
  const keyScore = keyMatch / Math.max(1, keyWords.length);

  // 기준 2: 모범 답안 핵심 단어 포함
  const modelWords = model.split(' ').filter(w => w.length > 2);
  const modelMatch = modelWords.filter(w => inp.includes(w)).length;
  const modelScore = modelMatch / Math.max(1, modelWords.length);

  // 기준 3: 길이 유사도 (너무 짧으면 감점)
  const lenScore = Math.min(1, inp.split(' ').length / Math.max(1, model.split(' ').length));

  // 2개 이상 기준 통과시 정답
  const scores = [keyScore >= 0.4, modelScore >= 0.35, lenScore >= 0.5];
  const passed = scores.filter(Boolean).length >= 2;

  return {
    passed,
    keyScore: Math.round(keyScore * 100),
    modelScore: Math.round(modelScore * 100),
    detail: scores
  };
}

// ── 12. Session Result Processing ────────────
function processSessionResult(lessonIdx, sessionState) {
  const sentence = LECTURES[lessonIdx];
  const userModel = loadUserModel();

  // 감정 가중치 기록
  recordEmotionWeight(sentence.id, sentence.emo, userModel);

  const result = {
    correct: sessionState.correctCount >= 2,
    responseTime: sessionState.confidence > 0
      ? Math.max(1, 10 - sessionState.confidence) : 5,
    score: sessionState.correctCount,
    memoryStrength: sessionState.memoryStrength
  };

  updateMemory(userModel, sentence, result);

  const nextSentence = selectNextSentence(userModel);
  const nextPatterns = getNextRecommendedPatterns(userModel);

  logEvent('SESSION_COMPLETE', {
    score: result.score,
    correct: result.correct,
    memStr: sessionState.memoryStrength
  });

  return { userModel, nextSentence, nextPatterns, result };
}

// ── 13. Mastery Summary ───────────────────────
function getMasterySummary(userModel) {
  const entries = Object.entries(userModel.pattern_mastery);
  if (!entries.length) return { avg:0, strong:0, weak:0, total:0 };
  const avg = entries.reduce((s,[,v])=>s+v,0)/entries.length;
  return {
    avg: Math.round(avg*100),
    strong: entries.filter(([,v])=>v>=0.7).length,
    weak:   entries.filter(([,v])=>v<0.3).length,
    total:  entries.length
  };
}

// LESSON STATE MACHINE
// ════════════════════════════════════════════
const state = {
  step: 1,
  subStep: 0,

  // 답변 추적
  answers: {},         // {step: answer}
  correctCount: 0,     // 맞은 개수
  
  // 몰입 지표
  confidence: 0,       // 확신도 (빠를수록 높음)
  hesitation: 0,       // 망설임 횟수
  stepStartTime: 0,    // 스텝 시작 시간

  // 레슨 데이터
  lessonData: null,
  lessonIdx: -1,
  quizScore: 0,
  answered: false,

  // 자유출력 힌트 단계 (0=자유, 1=힌트, 2=선택지)
  freeHintLevel: 0,

  // memoryStrength
  memoryStrength: 'weak'  // weak / medium / strong
};

function setState(patch) {
  Object.assign(state, patch);
  // 스텝 전환 시 시간 기록
  if (patch.step !== undefined) {
    state.stepStartTime = Date.now();
  }
  render();
}

// 반응 시간 기록 → confidence 계산
function recordAnswer(correct) {
  const elapsed = (Date.now() - state.stepStartTime) / 1000;
  if (correct) {
    state.correctCount++;
    if (elapsed < 3) state.confidence += 2;
    else if (elapsed < 6) state.confidence += 1;
    state.quizScore++;
  } else {
    state.hesitation++;
    state.confidence = Math.max(0, state.confidence - 1);
  }
  // memoryStrength 업데이트
  const ratio = state.correctCount / Math.max(1, state.step);
  state.memoryStrength = ratio >= 0.8 ? 'strong' : ratio >= 0.5 ? 'medium' : 'weak';
}

// Next 버튼 없이 자동 진행
function autoNext(delay = 1200) {
  const btn = document.getElementById('cta-btn');
  if (btn) { btn.disabled = true; btn.textContent = '계속하는 중…'; }
  setTimeout(() => nextStep(), delay);
}

// ── CTA 핸들러 ──
function onCTA() {
  const btn = document.getElementById('cta-btn');
  if (btn.disabled) return;

  // step별 CTA 로직
  if (state.step === 2 || state.step === 5 || state.step === 7) {
    // 퀴즈 스텝 - 답 선택 강제
    if (!state.answered) { showToast('선택지를 먼저 선택해주세요!'); return; }
  }
  if (state.step === 8) {
    // 자유 출력 - 제출
    const inp = document.getElementById('free-inp');
    if (inp && !state.answered) { submitFreeOutput(inp.value.trim()); return; }
  }
  nextStep();
}

function nextStep() {
  logEvent('NEXT_STEP', {from: state.step});
  clearStallDetection();
  if (state.step >= 10) {
    completLesson();
    return;
  }
  setState({ step: state.step + 1, subStep: 0, userAnswer: null, answered: false });
}

// ── 메인 렌더 ──

  if (!state.lessonData) return;

  const container = document.getElementById('stage-container');
  const fill = document.getElementById('lh-fill');
  const counter = document.getElementById('lh-counter');
  const btn = document.getElementById('cta-btn');

  fill.style.width = ((state.step - 1) / 10 * 100) + '%';
  counter.textContent = `STEP ${state.step} / 10`;

  btn.className = 'cta';
  btn.textContent = state.step < 10 ? '다음 →' : '완료 ✓';

  const d = state.lessonData;
  const l = LECTURES[state.lessonIdx];

  switch (state.step) {
    case 1:  renderScene(container, d.STEP_1_Scene, l); break;
    case 2:  renderMeaningGuess(container, d.STEP_2_Meaning_Guess, btn); break;
    case 3:  renderChunking(container, d.STEP_3_Chunking, l); break;
    case 4:  renderPattern(container, d.STEP_4_Pattern); break;
    case 5:  renderControlled(container, d.STEP_5_Controlled_Practice, btn); break;
    case 6:  renderVariation(container, d.STEP_6_Variation); break;
    case 7:  renderGuided(container, d.STEP_7_Guided_Output, btn); break;
    case 8:  renderFreeOutput(container, d.STEP_8_Free_Output, btn); break;
    case 9:  renderEmotion(container, d.STEP_9_Emotion_Reinforcement); break;
    case 10: renderMemory(container, d.STEP_10_Memory_System); break;
  }

  container.scrollTop = 0;
}

function showFreeHint(level, hint1, hint2, model) {
  state.freeHintLevel = level;

async function submitFreeOutput(val) {
  // freeHintLevel에 따라 입력창 분기
  if (state.freeHintLevel === 1) {
    const inp2 = document.getElementById('free-inp2');
    if (inp2) val = inp2.value.trim();
  }
  if (!val) { showToast('영어로 입력해주세요'); return; }
  const btn = document.getElementById('cta-btn');
  btn.disabled = true;
  btn.textContent = 'AI 평가 중…';

  const d = state.lessonData.STEP_8_Free_Output;
  const l = LECTURES[state.lessonIdx];

  const prompt = `Target: "${l.s}" / Input: "${val}" / Model: "${d.model_answer||l.s}"
Evaluate meaning similarity. JSON only:
{"pass":true|false,"feedback_kr":"2문장 피드백","model_answer":"${d.model_answer||l.s}"}`;

  // 1차: 로컬 의미 기반 평가 (패턴 + 핵심 단어 + 길이)
  const d8 = state.lessonData?.STEP_8_Free_Output;
  const sentence8 = LECTURES[state.lessonIdx];
  const localEval = evaluateFreeOutput(val, sentence8, d8?.model_answer);
  clearStallDetection();
  logEvent('FREE_OUTPUT_SUBMIT', { valLen: val.length, localPass: localEval.passed });

  const modelAns = d8?.model_answer || sentence8.s;

  if (localEval.passed) {
    // 로컬 통과 → 즉시 피드백 (API 불필요)
    confetti(); playSound('correct'); addXP(20);
    recordAnswer(true);
    showFreeOutputResult(true, modelAns, `패턴 포함 ${localEval.keyScore}% · 핵심 단어 ${localEval.modelScore}% 일치해요.`, btn);
  } else {
    // 로컬 실패 → AI 정밀 평가
    btn.textContent = 'AI 평가 중…'; btn.disabled = true;
    const prompt = `Target: "${sentence8.s}" / Input: "${val}" / Model: "${modelAns}"
Patterns: ${JSON.stringify(sentence8.patterns||[])}
Evaluate meaning similarity. Be lenient if key patterns present.
JSON only: {"pass":true|false,"feedback_kr":"2문장 피드백 (격려 포함)","model_answer":"${modelAns}"}`;
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ model:'claude-sonnet-4-20250514', max_tokens:300, messages:[{role:'user',content:prompt}] })
      });
      const data = await res.json();
      const ai = JSON.parse(data.content[0].text.replace(/```json|```/g,'').trim());
      if (ai.pass) { confetti(); playSound('correct'); addXP(20); recordAnswer(true); }
      else { playSound('wrong'); recordAnswer(false); }
      showFreeOutputResult(ai.pass, ai.model_answer, ai.feedback_kr, btn);
    } catch(err) {
      // API 실패시 관대하게 통과
      playSound('correct'); addXP(10); recordAnswer(true);
      showFreeOutputResult(true, modelAns, '좋은 시도예요! 모범 답안과 비교해보세요.', btn);
    }
  }
}

      ${l.ckr}<br><i style="color:var(--acc);">"${l.cen}"</i>
    </div>
    ${S.done.length < LECTURES.length ? `<div style="font-size:0.85rem;color:var(--acc3);font-weight:700;">🔓 다음 표현이 열렸어요!</div>` : '<div style="font-size:0.85rem;color:var(--gold);font-weight:700;">🏆 모든 표현 완료!</div>'}
    ${(()=>{
      const ns = state._nextSentence;
      if (ns && ns.id !== l.id) {
        const um = loadUserModel();
        const mastery = (ns.patterns||[]).reduce((s,p)=>s+(um.pattern_mastery[p]||0),0) / Math.max(1,(ns.patterns||[]).length);
        return `<div style="background:rgba(108,63,255,0.06);border:2px solid rgba(108,63,255,0.14);border-radius:var(--r2);padding:14px 16px;margin-top:14px;cursor:pointer;" onclick="startLesson(${LECTURES.findIndex(x=>x.id===ns.id)})">
          <div style="font-size:0.6rem;font-weight:800;letter-spacing:0.1em;color:var(--acc);text-transform:uppercase;margin-bottom:6px;">🧠 AI 추천 다음 학습</div>
          <div style="font-size:0.88rem;font-weight:700;color:var(--txt);margin-bottom:4px;">${ns.s}</div>
          <div style="font-size:0.72rem;color:var(--mut);">숙달도 ${Math.round(mastery*100)}% · ${ns.cefr}</div>
        </div>`;
      }
      return '';
    })()}
  </div>`;

  // 별 순차 점등
  Array.from({length:stars}).forEach((_,i) => {
    setTimeout(() => { const s=document.getElementById('st'+i); if(s) s.classList.add('lit'); }, i*300+200);
  });

  const btn = document.getElementById('cta-btn');
  btn.textContent = '← 목록으로';
  btn.onclick = () => { showLayer('path'); btn.onclick = onCTA; renderPath(); };
  document.getElementById('lh-fill').style.width = '100%';
  document.getElementById('lh-counter').textContent = 'STEP 10 / 10';
}

function closeLessonConfirm() {
  if (confirm('학습을 종료할까요?\n진도는 저장되지 않습니다.')) {
    showLayer('path');
    renderPath();
  }
}

// ════════════════════════════════════════════
// PATH
// ════════════════════════════════════════════
function renderPath() {
  const c = document.getElementById('path-body');
  let h = '';
  LECTURES.forEach((l, i) => {
    const done = S.done.includes(l.id);
    const cur = !done && unlocked(i);
    const lk = !done && !cur;
    const cls = done ? 'done' : cur ? 'cur' : 'lk';
    const ico = done ? '✓' : cur ? (EICON[l.emo]||'📖') : '🔒';
    const num = String(i+1).padStart(3,'0');
    const bub = cur ? `<div class="node-bubble">탭하여 시작</div>` : '';
    h += `<div class="node-wrap fade-in" style="animation-delay:${i*0.05}s">
      <div class="node ${cls}" onclick="nodeClick(${i})">
        <div class="node-ico">${ico}</div>
        <div class="node-num">${num}</div>${bub}
      </div></div>`;
    if (i < LECTURES.length-1)
      h += `<div class="path-connector ${unlocked(i+1)||done?'on':'off'}"></div>`;
    if (i===4 && LECTURES.slice(0,5).every(x=>S.done.includes(x.id)))
      h += `<div class="milestone">🏆 전반전 완주! +50 XP</div>`;
  });
  c.innerHTML = h;
  updateBars();
}

function nodeClick(i) {
  if (!unlocked(i)) {
    const t = document.getElementById('toast');
    t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2000);
    return;
  }
  startLesson(i);
}

// ════════════════════════════════════════════
// XP & GAMIFICATION
// ════════════════════════════════════════════
function addXP(n, label='') {
  const prev = getLv();
  S.xp += n; saveS();
  const nw = getLv();
  updateBars();
  const p = document.getElementById('xp-pop');
  p.textContent = `+${n} XP ${label}`;
  p.classList.add('show'); setTimeout(()=>p.classList.remove('show'), 1400);
  if (nw.lv > prev.lv) {
    document.getElementById('lvl-ico').textContent = nw.ico;
    document.getElementById('lvl-sub').textContent = `레벨 ${nw.lv} 달성`;
    document.getElementById('lvl-nm').textContent = nw.nm;
    document.getElementById('lvl-overlay').classList.add('show');
  }
}

function updateBars() {
  const lv=getLv(), nx=getNextLv();
  const base=lv.xp, top=nx?nx.xp:lv.xp+100;
  const pct=Math.min(100,((S.xp-base)/(top-base))*100);
  document.getElementById('xp-fill').style.width=pct+'%';
  document.getElementById('xp-txt').textContent=S.xp+' XP';
  document.getElementById('lv-chip').textContent=`${lv.ico} Lv.${lv.lv}`;
  document.getElementById('streak-num').textContent=S.streak||0;
}

function confetti() {
  const colors=['#6c3fff','#ff3d7f','#00e5b0','#f5a623','#fff'];
  for(let i=0;i<45;i++){
    const el=document.createElement('div');
    el.className='confetti-piece';
    el.style.cssText=`left:${Math.random()*100}vw;top:${Math.random()*30}vh;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${0.8+Math.random()*0.8}s;animation-delay:${Math.random()*0.3}s;border-radius:${Math.random()>0.5?'50%':'2px'};`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),2000);
  }
  if(navigator.vibrate) navigator.vibrate([60,30,60]);
}

function playSound(type) {
  try {
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    if(type==='correct'){o.frequency.setValueAtTime(523,ctx.currentTime);o.frequency.setValueAtTime(659,ctx.currentTime+0.1);o.frequency.setValueAtTime(784,ctx.currentTime+0.2);g.gain.setValueAtTime(0.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.5);}
    else{o.frequency.setValueAtTime(280,ctx.currentTime);g.gain.setValueAtTime(0.2,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3);}
    o.start();o.stop(ctx.currentTime+0.5);
  } catch(e){}
}

function checkBadges() {
  BADGES.forEach(b => {
    if (!S.badges[b.id] && b.fn(S)) {
      S.badges[b.id]=true; saveS();
      setTimeout(()=>{
        const p=document.getElementById('xp-pop');
        p.textContent=`🏅 ${b.nm}`;
        p.classList.add('show'); setTimeout(()=>p.classList.remove('show'),2200);
      },1600);
    }
  });
}

// ════════════════════════════════════════════
// STATS
// ════════════════════════════════════════════
function renderStats() {
  const lv=getLv();
  document.getElementById('s-done').textContent=S.done.length;
  document.getElementById('s-lv').textContent=lv.lv;
  document.getElementById('s-xp').textContent=S.xp||0;
  document.getElementById('s-str').textContent=S.streak||0;
  document.getElementById('badges').innerHTML=BADGES.map(b=>{
    const on=S.badges&&S.badges[b.id];
    return `<div class="badge ${on?'on':''}"><div class="badge-ico">${b.ico}</div><div class="badge-nm">${b.nm}</div></div>`;
  }).join('');
  document.getElementById('prog-list').innerHTML=LECTURES.map((l,i)=>{
    const done=S.done.includes(l.id), ul=unlocked(i);
    const um=loadUserModel();
    const mastery=(l.patterns||[]).reduce((s,p)=>s+(um.pattern_mastery[p]||0),0)/Math.max(1,(l.patterns||[]).length);
    const bar=Math.round(mastery*100);
    return `<div class="pr">
      <span class="pn">${String(i+1).padStart(2,'0')}</span>
      <div style="flex:1;min-width:0;">
        <div style="font-size:0.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;">${l.s}</div>
        <div style="height:5px;background:var(--surf);border-radius:3px;overflow:hidden;border:1px solid var(--bdr);">
          <div style="height:100%;width:${bar}%;background:${bar>=70?'var(--acc3)':bar>=40?'var(--acc)':'var(--acc2)'};border-radius:3px;transition:width 0.4s;"></div>
        </div>
      </div>
      <span class="pst ${done?'done':'pend'}" style="font-size:0.7rem;">${done?'✅':ul?'🔓':'🔒'} ${bar}%</span>
    </div>`;
  }).join('');

  // 패턴 mastery 요약
  const um=loadUserModel();
  const summary=getMasterySummary(um);
  const masteryEl=document.getElementById('mastery-summary');
  if(masteryEl) masteryEl.innerHTML=`
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;">
      <div class="sc"><div class="sn" style="font-size:1.5rem;">${summary.avg}%</div><div class="sl">평균 숙달도</div></div>
      <div class="sc"><div class="sn" style="font-size:1.5rem;background:linear-gradient(135deg,var(--acc3),#00a070);-webkit-background-clip:text;">${summary.strong}</div><div class="sl">강한 패턴</div></div>
      <div class="sc"><div class="sn" style="font-size:1.5rem;background:linear-gradient(135deg,var(--acc2),#cc2060);-webkit-background-clip:text;">${summary.weak}</div><div class="sl">약한 패턴</div></div>
    </div>`;
}

// ════════════════════════════════════════════
// LAYER SYSTEM
// ════════════════════════════════════════════
function showLayer(name) {
  document.querySelectorAll('.layer').forEach(l=>l.classList.remove('active'));
  const target = document.getElementById('layer-'+name);
  if (target) target.classList.add('active');
  // nav 상태
  ['path','stats','info'].forEach(v=>{
    const a=document.getElementById('nb-'+v), b=document.getElementById('nb2-'+v);
    if(a) a.classList.toggle('on', v===name);
    if(b) b.classList.toggle('on', v===name);
  });
  if (name==='stats') renderStats();
}

function showLoading(txt) {
  document.getElementById('ld-txt').textContent = txt;
  document.getElementById('loading').classList.add('show');
}
function hideLoading() {
  document.getElementById('loading').classList.remove('show');
}
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}


function showFreeOutputResult(pass, modelAns, feedback, btn) {
  const fb = document.getElementById('fb8');
  if (fb) {
    fb.style.display = 'block';
    fb.innerHTML = `
      <div style="background:${pass?'rgba(0,196,154,0.09)':'rgba(255,61,127,0.07)'};border:2px solid ${pass?'rgba(0,196,154,0.28)':'rgba(255,61,127,0.22)'};border-radius:var(--r);padding:14px 18px;">
        <div style="font-size:1rem;font-weight:900;color:${pass?'#006b54':'#a01040'};margin-bottom:8px;">${pass?'🎉 훌륭해요!':'💪 조금만 더!'}</div>
        <div style="background:var(--surf);border-radius:10px;padding:10px 14px;margin-bottom:8px;">
          <div style="font-size:0.6rem;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px;">모범 답안</div>
          <div style="font-size:0.95rem;font-weight:700;color:var(--txt);">${modelAns}</div>
        </div>
        <div style="font-size:0.86rem;line-height:1.8;color:var(--txt);">${feedback}</div>
        <button onclick="sp('${e(modelAns)}','en')" style="margin-top:10px;background:var(--surf);border:1.5px solid var(--bdr);border-radius:10px;padding:6px 14px;font-family:inherit;font-size:0.78rem;font-weight:700;color:var(--acc);cursor:pointer;">🔊 듣기</button>
      </div>`;
  }
  setState({ answered: true });
  if (btn) { btn.disabled = false; btn.textContent = '다음 →'; }
}
// ════════════════════════════════════════════
// UTIL
// ════════════════════════════════════════════
function sp(t, lang) {
  if (!speechSynthesis) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang=lang==='en'?'en-US':'ko-KR'; u.rate=lang==='en'?0.85:0.9;
  speechSynthesis.speak(u);
}
function e(s) { return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
function shuffle(a) { return [...a].sort(()=>Math.random()-0.5); }

// ════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════
renderPath();
</script>
